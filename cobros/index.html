<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CobraFácil">
<meta name="theme-color" content="#022c22">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23059669'/%3E%3Ctext x='90' y='122' font-family='Arial,Helvetica,sans-serif' font-size='100' font-weight='700' fill='white' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23059669'/%3E%3Ctext x='90' y='122' font-family='Arial,Helvetica,sans-serif' font-size='100' font-weight='700' fill='white' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E">
<title>CobraFácil · Inversiones Restrepo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#059669;--brand-600:#047857;--brand-700:#065f46;--brand-800:#064e3b;--brand-900:#022c22;
  --brand-50:#ecfdf5;--brand-100:#d1fae5;--brand-200:#a7f3d0;
  --ink:#0b1712;--ink-2:#34413b;--muted:#6b7a73;--muted-2:#9aa8a1;--line:#e4ebe7;--bg:#f2f5f3;--card:#fff;
  --red:#dc2626;--red-50:#fef2f2;--red-100:#fee2e2;--amber:#b45309;--amber-50:#fffbeb;--amber-100:#fef3c7;
  --blue:#2563eb;--blue-50:#eff6ff;
  --r-lg:20px;--r-md:16px;--r-sm:12px;
  --sh-1:0 1px 2px rgba(10,30,20,.05),0 2px 10px rgba(10,30,20,.05);
  --sh-2:0 10px 30px rgba(5,30,20,.14);
  --sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;background:#d7dfdb;color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;user-select:none;-webkit-user-select:none}
input,select{font:inherit;color:inherit}
#app{position:relative;max-width:430px;height:100dvh;margin:0 auto;background:var(--bg);overflow:hidden;overflow:clip}
@media (min-width:500px){#app{box-shadow:0 0 0 1px rgba(0,0,0,.04),0 30px 80px rgba(0,0,0,.18)}}
.num{font-variant-numeric:tabular-nums}

/* ---------- LOGIN ---------- */
#login{position:absolute;inset:0;z-index:40;background:linear-gradient(170deg,#064e3b 0%,#022c22 70%);color:#fff;display:flex;flex-direction:column;padding:calc(var(--sat) + 56px) 24px calc(var(--sab) + 24px);transition:opacity .45s,transform .45s}
#login.out{opacity:0;transform:scale(1.04);pointer-events:none}
.logo-mark{width:64px;height:64px;border-radius:18px;background:var(--brand);display:grid;place-items:center;box-shadow:0 10px 30px rgba(5,150,105,.35)}
.login-title{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:22px}
.login-sub{color:#a7f3d0;opacity:.85;margin-top:6px;font-size:15px}
.login-card{margin-top:38px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:var(--r-lg);padding:18px}
.l-field{margin-bottom:12px}
.l-field label{display:block;font-size:12px;color:#a7c9bb;margin-bottom:6px;font-weight:600}
.l-field input{width:100%;height:50px;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.18);color:#fff;padding:0 14px;font-size:15px;outline:none}
.l-field input:focus{border-color:var(--brand)}
.btn{height:52px;border-radius:15px;font-weight:700;font-size:15.5px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;transition:transform .12s,opacity .2s,background .2s}
.btn:active{transform:scale(.97)}
.btn-brand{background:var(--brand);color:#fff}
.btn-dark{background:var(--ink);color:#fff}
.btn-ghost{background:var(--brand-50);color:var(--brand-700)}
.btn-line{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn-wa{background:#16a34a;color:#fff}
.btn-sm{height:40px;font-size:13.5px;border-radius:12px}
.btn[disabled]{opacity:.55;pointer-events:none}
.spin{width:20px;height:20px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:sp .7s linear infinite}
.spin.dk{border-color:rgba(5,150,105,.2);border-top-color:var(--brand)}
@keyframes sp{to{transform:rotate(360deg)}}
.faceid-btn{margin-top:14px;color:#d1fae5;font-weight:600;font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:46px}
.login-foot{margin-top:auto;text-align:center;font-size:12px;color:#6ee7b7;opacity:.6}
#faceOverlay{position:absolute;inset:0;z-index:45;background:rgba(2,20,15,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;flex-direction:column;color:#fff;gap:18px}
#faceOverlay.on{display:flex;animation:fade .25s}
.face-box{width:120px;height:120px;position:relative}
.face-box svg{width:100%;height:100%}
.scanline{position:absolute;left:10px;right:10px;height:2px;background:#34d399;box-shadow:0 0 12px #34d399;animation:scan 1.1s ease-in-out infinite alternate;top:12px}
@keyframes scan{to{top:106px}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ---------- SHELL ---------- */
#main{position:absolute;inset:0;display:flex;flex-direction:column}
header.top{flex:none;padding:calc(var(--sat) + 12px) 18px 12px;display:flex;align-items:center;gap:12px;background:rgba(242,245,243,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:5;border-bottom:1px solid transparent;transition:border-color .2s}
header.top.sc{border-bottom-color:var(--line)}
.h-left{flex:1;min-width:0}
.h-small{font-size:12.5px;color:var(--muted);font-weight:500}
.h-title{font-size:22px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:42px;height:42px;border-radius:13px;background:#fff;display:grid;place-items:center;box-shadow:var(--sh-1);position:relative;flex:none}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:21px;height:21px}
.badge{position:absolute;top:7px;right:8px;min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid #fff}
.avatar-me{width:42px;height:42px;border-radius:13px;background:var(--brand-800);color:#fff;font-weight:700;font-size:14px;display:grid;place-items:center;flex:none}
#screen{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:4px 16px calc(var(--sab) + 100px)}
#screen.in{animation:scrIn .32s cubic-bezier(.2,.8,.2,1)}
@keyframes scrIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
nav.tabs{position:absolute;left:0;right:0;bottom:0;z-index:6;background:rgba(255,255,255,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;padding:8px 6px calc(var(--sab) + 8px)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--muted-2);padding:4px 0;transition:color .2s}
.tab svg{width:24px;height:24px;transition:transform .2s}
.tab.on{color:var(--brand)}
.tab.on svg{transform:translateY(-1px)}
.tab:active svg{transform:scale(.88)}

/* ---------- COMMON ---------- */
.card{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--sh-1);padding:16px}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 10px}
.sec-h h3{font-size:16px;font-weight:700;letter-spacing:-.01em}
.sec-h .link{font-size:13px;color:var(--brand);font-weight:700;padding:6px 0 6px 10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.muted{color:var(--muted)}
.lbl{font-size:12px;color:var(--muted);font-weight:600}
.big{font-size:22px;font-weight:800;letter-spacing:-.02em}
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor;display:block}
.p-paid{background:var(--brand-50);color:var(--brand-600)}
.p-pend{background:var(--amber-50);color:var(--amber)}
.p-late{background:var(--red-50);color:var(--red)}
.p-gray{background:#f1f4f2;color:var(--muted)}
.p-blue{background:var(--blue-50);color:var(--blue)}
.list{background:#fff;border-radius:var(--r-lg);box-shadow:var(--sh-1);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left;transition:background .15s}
.li:last-child{border-bottom:0}
.li:active{background:#f6f9f7}
.av{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.li-main{flex:1;min-width:0}
.li-t{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-s{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-r{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.li-amt{font-weight:800;font-size:14.5px}
.flash{animation:flash 1.4s ease}
@keyframes flash{0%{background:#d1fae5}100%{background:#fff}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;margin:12px -16px 0;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{height:36px;padding:0 14px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:6px;color:var(--ink-2);transition:all .18s}
.chip b{font-size:11px;background:#eef2f0;border-radius:999px;padding:1px 7px;color:var(--muted)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.on b{background:rgba(255,255,255,.18);color:#fff}
.search{display:flex;align-items:center;gap:10px;height:46px;background:#fff;border-radius:14px;padding:0 14px;box-shadow:var(--sh-1)}
.search svg{width:19px;height:19px;color:var(--muted-2);flex:none}
.search input{flex:1;border:0;outline:none;background:none;font-size:15px;min-width:0}
.empty{text-align:center;padding:36px 20px;color:var(--muted);font-size:14px}
.empty div{font-size:34px;margin-bottom:8px}
.bar{height:8px;background:#eef2f0;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--brand);border-radius:99px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}

/* skeleton */
.sk{background:linear-gradient(90deg,#e7ece9 0%,#f3f6f4 50%,#e7ece9 100%);background-size:200% 100%;animation:shim 1s linear infinite;border-radius:16px}
@keyframes shim{from{background-position:200% 0}to{background-position:-200% 0}}

/* ---------- INICIO ---------- */
.hero{background:linear-gradient(160deg,#065f46 0%,#022c22 100%);color:#fff;border-radius:22px;padding:20px;position:relative;overflow:hidden;box-shadow:0 14px 30px rgba(2,44,34,.25)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;border:34px solid rgba(255,255,255,.04)}
.hero .lbl{color:#a7f3d0}
.hero-amt{font-size:34px;font-weight:800;letter-spacing:-.03em;margin-top:6px}
.hero-of{font-size:13.5px;color:#a7f3d0;margin-top:2px}
.hero .bar{background:rgba(255,255,255,.12);height:10px;margin-top:16px}
.hero .bar>i{background:#34d399;box-shadow:0 0 14px rgba(52,211,153,.5)}
.hero-foot{display:flex;justify-content:space-between;margin-top:10px;font-size:12.5px;color:#d1fae5}
.hero-month{position:absolute;top:18px;right:18px;font-size:11.5px;font-weight:700;background:rgba(255,255,255,.1);padding:5px 10px;border-radius:99px;color:#d1fae5;z-index:1}
.stat{padding:14px}
.stat .v{font-size:19px;font-weight:800;letter-spacing:-.02em;margin-top:6px}
.stat .s{font-size:12px;color:var(--muted);margin-top:3px}
.stat.red{background:#fff;border:1px solid var(--red-100)}
.stat.red .v{color:var(--red)}
.stat-ico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center}
.stat-ico svg{width:18px;height:18px}
.wa-cta{display:flex;align-items:center;gap:12px;margin-top:12px;background:#fff;border-radius:var(--r-lg);padding:14px;box-shadow:var(--sh-1);width:100%;text-align:left}
.wa-cta:active{transform:scale(.985)}
.wa-ico{width:44px;height:44px;border-radius:14px;background:#dcfce7;display:grid;place-items:center;flex:none}
.wa-ico svg{width:24px;height:24px}
.chev{width:18px;height:18px;color:var(--muted-2);flex:none}
.date-badge{width:46px;height:48px;border-radius:13px;background:var(--brand-50);color:var(--brand-700);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;line-height:1}
.date-badge b{font-size:17px;font-weight:800}
.date-badge span{font-size:10.5px;font-weight:700;text-transform:uppercase;margin-top:3px}
.chart-legend{display:flex;gap:14px;font-size:12px;color:var(--muted);font-weight:600}
.chart-legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.cf-bar{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.grown .cf-bar{transform:scaleY(1)}
.ring-wrap{display:flex;align-items:center;gap:16px}
.ring{width:76px;height:76px;flex:none;position:relative}
.ring svg{width:76px;height:76px;transform:rotate(-90deg)}
.ring circle{transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:17px}

/* ---------- SHEETS ---------- */
#sheetWrap{position:absolute;inset:0;z-index:30;pointer-events:none;overflow:hidden;overflow:clip}
#sheetWrap.on{pointer-events:auto}
.backdrop{position:absolute;inset:0;background:rgba(2,20,14,.45);opacity:0;transition:opacity .3s}
#sheetWrap.on .backdrop{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:93%;background:var(--bg);border-radius:24px 24px 0 0;transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.85,.25,1);display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.15)}
#sheetWrap.on .sheet{transform:translateY(0)}
.sheet.tall{height:93%}
.sh-grab{padding:9px 0 2px;display:flex;justify-content:center;flex:none;touch-action:none}
.sh-grab i{width:40px;height:5px;border-radius:9px;background:#cfd8d3}
.sh-head{display:flex;align-items:center;gap:10px;padding:6px 14px 10px;flex:none;touch-action:none}
.sh-head h2{flex:1;font-size:18px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-btn{width:36px;height:36px;border-radius:11px;background:#fff;display:grid;place-items:center;box-shadow:var(--sh-1);flex:none}
.sh-btn svg{width:18px;height:18px}
.sh-body{overflow-y:auto;padding:4px 16px calc(var(--sab) + 22px);-webkit-overflow-scrolling:touch;overscroll-behavior:contain;flex:1}
.sh-body.swap{animation:swap .28s ease}
@keyframes swap{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.kv{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px;gap:12px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted)}
.kv b{font-weight:700;text-align:right}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{background:#fff;border-radius:14px;padding:12px;box-shadow:var(--sh-1)}
.mini .lbl{font-size:11.5px}
.mini b{display:block;font-size:15px;font-weight:800;margin-top:4px}
.actions{display:grid;gap:10px;margin-top:16px}
.actions.two{grid-template-columns:1fr 1fr}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:7px}
.field input,.field select{width:100%;height:50px;border-radius:14px;border:1px solid var(--line);background:#fff;padding:0 14px;font-size:15px;outline:none;-webkit-appearance:none;appearance:none}
.field input:focus,.field select:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(5,150,105,.12)}
.money-in{position:relative}
.money-in input{padding-left:30px;font-weight:800;font-size:20px;height:58px}
.money-in::before{content:"$";position:absolute;left:14px;top:50%;transform:translateY(-50%);font-weight:800;font-size:20px;color:var(--muted)}
.methods{display:flex;flex-wrap:wrap;gap:8px}
.method{height:40px;padding:0 14px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:13.5px;font-weight:600;transition:all .15s}
.method.on{border-color:var(--brand);background:var(--brand-50);color:var(--brand-700);box-shadow:0 0 0 2px rgba(5,150,105,.15)}
.attach{border:1.5px dashed #c5d2cb;border-radius:16px;padding:18px;display:flex;align-items:center;gap:12px;background:#fff;width:100%;text-align:left}
.attach .ai{width:44px;height:44px;border-radius:13px;background:var(--brand-50);display:grid;place-items:center;color:var(--brand);flex:none}
.attach .ai svg{width:22px;height:22px}
.thumb{width:52px;height:64px;border-radius:8px;background:#fff;border:1px solid var(--line);flex:none;padding:6px;display:flex;flex-direction:column;gap:3px;box-shadow:var(--sh-1)}
.thumb i{display:block;height:3px;border-radius:2px;background:#dbe3df}
.thumb i.g{background:var(--brand);width:60%}
.done-anim{text-align:center;padding:40px 0 30px}
.done-anim svg{width:96px;height:96px}
.done-anim .c{stroke-dasharray:290;stroke-dashoffset:290;animation:draw .6s ease forwards}
.done-anim .k{stroke-dasharray:80;stroke-dashoffset:80;animation:draw .4s .5s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.done-anim h3{font-size:21px;font-weight:800;margin-top:14px;animation:fade .4s .6s both}
.done-anim p{color:var(--muted);margin-top:6px;animation:fade .4s .7s both}

/* receipt */
.receipt{background:#fff;border-radius:18px;padding:22px 20px;box-shadow:var(--sh-2);position:relative;overflow:hidden;animation:rcIn .5s cubic-bezier(.2,.8,.2,1)}
@keyframes rcIn{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}
.receipt::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:var(--brand)}
.rc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.rc-brand{display:flex;gap:10px;align-items:center}
.rc-logo{width:38px;height:38px;border-radius:11px;background:var(--brand-800);color:#fff;display:grid;place-items:center;font-weight:800}
.rc-no{text-align:right;font-size:11px;color:var(--muted)}
.rc-no b{display:block;color:var(--ink);font-size:13px}
.rc-amt{margin:20px 0 4px;font-size:30px;font-weight:800;letter-spacing:-.02em}
.rc-words{font-size:12px;color:var(--muted);font-style:italic}
.rc-dash{border-top:1.5px dashed var(--line);margin:16px 0}
.rc-row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;gap:10px}
.rc-row span{color:var(--muted)}
.rc-row b{text-align:right;font-weight:600}
.rc-sign{margin-top:22px;display:flex;justify-content:space-between;align-items:flex-end}
.rc-sign div{font-size:11px;color:var(--muted);border-top:1px solid #cdd6d1;padding-top:6px;width:48%}
.stamp{position:absolute;right:16px;top:118px;border:3px solid var(--brand);color:var(--brand);font-weight:800;font-size:24px;letter-spacing:.14em;padding:4px 14px;border-radius:10px;transform:rotate(-14deg);opacity:.85;animation:stamp .5s .35s cubic-bezier(.3,1.6,.5,1) both;background:rgba(236,253,245,.6)}
.stamp small{display:block;font-size:9px;letter-spacing:.08em;text-align:center;font-weight:700;margin-top:-2px}

.wa-chat{padding:14px 12px 16px;min-height:150px;background-color:#efeae2;background-image:radial-gradient(rgba(0,0,0,.035) 1px,transparent 1px);background-size:14px 14px}
.wa-day{text-align:center;margin-bottom:10px}
.wa-day span{background:#fff;font-size:11px;color:#54656f;padding:4px 10px;border-radius:8px;box-shadow:0 1px 1px rgba(0,0,0,.06)}
.wa-bub{background:#d9fdd3;border-radius:10px 2px 10px 10px;padding:8px 10px 6px;margin-left:34px;font-size:13.5px;line-height:1.42;color:#111b21;box-shadow:0 1px 1px rgba(0,0,0,.08);animation:bub .35s cubic-bezier(.2,.9,.3,1.3)}
@keyframes bub{from{opacity:0;transform:translateY(10px) scale(.94)}to{opacity:1;transform:none}}
.wa-meta{display:flex;justify-content:flex-end;align-items:center;gap:3px;font-size:10.5px;color:#667781;margin-top:3px}
.ticks{width:17px;height:11px;color:#8696a0;transition:color .3s}
.ticks.read{color:#53bdeb}
.send-row .st{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;background:#f1f4f2;color:var(--muted-2)}
.send-row .st svg{width:15px;height:15px}
.send-row.ok .st{background:#16a34a;color:#fff;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.send-row.ok{background:#f6fdf8}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
.send-row .spin{width:18px;height:18px}

/* propiedades */
.prop-card{background:#fff;border-radius:var(--r-lg);box-shadow:var(--sh-1);overflow:hidden;margin-bottom:12px;width:100%;text-align:left;display:block}

.prop-img svg.bg{position:absolute;inset:0;width:100%;height:100%}
.prop-img .tag{position:relative;font-size:11px;font-weight:700;background:rgba(255,255,255,.16);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:4px 9px;border-radius:99px}
.prop-body{padding:14px}
.unit-dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}
.unit-dots span{font-size:10.5px;font-weight:700;padding:4px 7px;border-radius:7px;background:var(--brand-50);color:var(--brand-700)}
.unit-dots span.free{background:#f1f4f2;color:var(--muted)}
.docs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.doc{background:#fff;border-radius:14px;padding:12px;box-shadow:var(--sh-1);text-align:left;display:flex;flex-direction:column;gap:10px}

.doc small{font-size:11px;color:var(--muted)}
.paper{background:#fff;border-radius:6px;box-shadow:var(--sh-2);padding:26px 22px;font-size:10.5px;line-height:1.6;color:#333}
.paper h4{text-align:center;font-size:12px;letter-spacing:.04em;margin-bottom:12px}
.paper .ln{height:6px;background:#eceff0;border-radius:3px;margin:7px 0}

/* prestamos */

.loan-card:active{transform:scale(.99)}
.sim-cta{display:flex;gap:14px;align-items:center;background:var(--brand-50);border:1px solid var(--brand-100);border-radius:var(--r-lg);padding:16px;width:100%;text-align:left;margin-top:12px}
.sim-cta .ai{width:46px;height:46px;border-radius:14px;background:var(--brand);color:#fff;display:grid;place-items:center;flex:none}
.sim-cta .ai svg{width:24px;height:24px}
.amort{width:100%;border-collapse:collapse;font-size:12px}
.amort th{position:sticky;top:0;background:#f7faf8;color:var(--muted);font-weight:700;font-size:11px;text-align:right;padding:9px 6px;border-bottom:1px solid var(--line)}
.amort th:first-child,.amort td:first-child{text-align:left}

.amort tr.paid td{color:var(--muted)}
.amort tr.cur td{background:var(--amber-50);font-weight:700}
.amort .ok{color:var(--brand);font-weight:800}

.toggle.on{background:var(--brand)}

.cat-bar{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:13px}
.cat-bar span{width:104px;flex:none;color:var(--ink-2);font-weight:600}
.cat-bar .bar{flex:1}
.cat-bar b{width:84px;text-align:right;flex:none;font-size:12.5px}
.report{background:#fff;border-radius:16px;padding:14px;box-shadow:var(--sh-1);display:flex;gap:12px;align-items:center;margin-bottom:10px;width:100%;text-align:left}
.report .bar{margin-top:8px;height:5px;display:none}
.report.gen .bar{display:block}

/* toast & push */
#toast{position:absolute;left:16px;right:16px;bottom:calc(var(--sab) + 92px);z-index:90;background:var(--ink);color:#fff;border-radius:15px;padding:13px 15px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:10px;box-shadow:var(--sh-2);transform:translateY(20px);opacity:0;transition:all .3s cubic-bezier(.2,.9,.3,1.2);pointer-events:none}
#toast.on{transform:none;opacity:1}
#toast .tk{width:22px;height:22px;border-radius:50%;background:var(--brand);display:grid;place-items:center;flex:none}
#toast .tk svg{width:13px;height:13px}
#push{position:absolute;left:10px;right:10px;top:calc(var(--sat) + 8px);z-index:95;background:rgba(255,255,255,.93);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border-radius:20px;padding:12px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 12px 40px rgba(0,0,0,.22);transform:translateY(-150%);transition:transform .55s cubic-bezier(.2,.9,.25,1.15);width:auto;text-align:left}
#push.on{transform:translateY(0)}
#push .pi{width:40px;height:40px;border-radius:11px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
#push .pt{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:600}
#push .pm{font-size:14px;font-weight:700;margin-top:2px;color:var(--ink)}
#push .ps{font-size:12.5px;color:var(--ink-2);margin-top:1px}
.hidden{display:none!important}
</style>

(function(){

  h += '<div class="slider-box"><div class="slider-top"><span class="lbl">Plazo</span><b id="sNv"></b></div><input type="range" id="sN" min="3" max="36" step="1" value="' + SIM.n + '" aria-label="Plazo en meses"><div class="slider-ends"><span>3 meses</span><span>36 meses</span></div></div>';
  h += '<div class="slider-box"><div class="slider-top"><span class="lbl">Tasa de interés mensual</span><b id="sRv"></b></div><input type="range" id="sR" min="1" max="5" step="0.1" value="' + SIM.r + '" aria-label="Tasa mensual"><div class="slider-ends"><span>1%</span><span>5%</span></div></div>';
  h += '<button class="btn btn-brand" data-act="simCreate">Crear préstamo con estos datos</button>';
  return {title:'Simulador de préstamo', tall:true, html:h, after:function(){
    ['sP','sN','sR'].forEach(function(k){ $('#' + k).addEventListener('input', simCalc); });
    simCalc(true);
  }};

var lastQ = 0;
function simCalc(first){
  SIM.P = +$('#sP').value; SIM.n = +$('#sN').value; SIM.r = +$('#sR').value;
  [['sP', (SIM.P - 1e6) / 49e6], ['sN', (SIM.n - 3) / 33], ['sR', (SIM.r - 1) / 4]].forEach(function(x){ $('#' + x[0]).style.background = 'linear-gradient(90deg,#059669 ' + (x[1] * 100) + '%,#e4ebe7 ' + (x[1] * 100) + '%)'; });
  $('#sPv').textContent = fmt(SIM.P); $('#sNv').textContent = SIM.n + ' meses'; $('#sRv').textContent = SIM.r.toFixed(1).replace('.', ',') + '% · ' + (Math.round((Math.pow(1 + SIM.r / 100, 12) - 1) * 1000) / 10).toString().replace('.', ',') + '% E.A.';
  var a = amort(SIM.P, SIM.r, SIM.n); var tot = SIM.P + a.ti;
  var q = $('#simQ');
  if (first === true) animateNum(q, 0, a.q, 900); else { q.textContent = fmt(a.q); if (a.q !== lastQ){ q.classList.add('bump'); setTimeout(function(){ q.classList.remove('bump'); }, 120); } }
  lastQ = a.q;
  $('#simTi').textContent = fmt(a.ti); $('#simTot').textContent = fmt(tot);
  $('#simEnd').textContent = fdy(addMonths(today(), SIM.n)); $('#simRent').textContent = (a.ti / SIM.P * 100).toFixed(1).replace('.', ',') + '%';
  $('#simCap').style.width = (SIM.P / tot * 100) + '%'; $('#simInt').style.width = (a.ti / tot * 100) + '%';
  var pts = [[0, 4]]; a.rows.forEach(function(r){ pts.push([r.i / SIM.n * 300, 4 + (1 - r.s / SIM.P) * 52]); });
  var d = pts.map(function(p, i){ return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
  $('#simLine').setAttribute('d', d); $('#simArea').setAttribute('d', d + ' L300 60 L0 60 Z');
}

    case 'detach': S.attached = false; $('#attachBox').innerHTML = attachHtml(); break;
    case 'confirmPay': confirmPay(id); break;
    case 'receipt': pushSheet(receiptSheet(id)); break;
    case 'dlPdf': (function(){ var c = getC(id); el.disabled = true; el.innerHTML = '<span class="spin"></span>'; setTimeout(function(){ el.disabled = false; el.innerHTML = '✓ PDF'; toast('RC-' + NOW.getFullYear() + '-0' + c.receipt + '.pdf guardado en Archivos'); }, 1100); })(); break;

    case 'doc': pushSheet(docSheet(id, v)); break;
    case 'upDoc': toast('Documento escaneado y guardado'); break;
    case 'renew': (function(){ var u = getU(id).u; u.endD = addMonths(u.endD, 12); toast('Contrato renovado hasta ' + fdy(u.endD)); replaceSheet(unitSheet(id)); if (S.tab === 'propiedades') renderProps(); })(); break;
    case 'publish': toast('Aviso copiado · listo para compartir'); break;
    case 'assign': pushSheet(formSheet('Asignar inquilino', [['fN','Nombre completo','text','Ej. Laura Gómez'],['fT','Celular','tel','300 000 0000'],['fC','Canon mensual','text','', fmt(getU(id).u.canon).slice(1), true],['fM','Duración del contrato','select',[['12','12 meses'],['6','6 meses'],['24','24 meses']]]], 'saveTenant', id, 'Asignar y crear contrato')); break;
    case 'saveTenant': (function(){ var n = val('fN'); if (!n){ toast('Escribe el nombre del inquilino'); return; } formSubmit(function(){ var x = getU(id), u = x.u; u.tenant = n; u.phone = val('fT') || '300 555 0101'; u.canon = money('fC') || u.canon; u.startD = today(); u.endD = addMonths(today(), +val('fM') || 12); u.payDay = addDays(5).getDate();
      cobros.push({id:'c' + (++cSeq), kind:'arriendo', unitId:u.id, propId:x.p.id, name:n, phone:u.phone, ref:u.name + ' · ' + x.p.short, concept:'Canon de arrendamiento ' + MESL[CM], amount:u.canon, due:addDays(5), paid:false, paidDate:null, method:null, receipt:null, fresh:true});
      toast(n.split(' ')[0] + ' asignado a ' + u.name); sheetStack.pop(); replaceSheet(unitSheet(id)); rerender(); }); })(); break;
    case 'addProp': openSheet(formSheet('Nueva propiedad', [['fN','Nombre','text','Ej. Edificio Mirador 45'],['fA','Dirección','text','Cl. 45 #12-30'],['fCi','Ciudad','select',[['Bogotá','Bogotá'],['Medellín','Medellín'],['Cali','Cali'],['Barranquilla','Barranquilla']]],['fTy','Tipo','select',[['Edificio','Edificio'],['Casa','Casa'],['Locales','Locales'],['Apartaestudio','Apartaestudio']]],['fU','Número de unidades','number','4'],['fC','Canon promedio','text','','1.500.000',true]], 'saveProp', '', 'Crear propiedad')); break;
    case 'saveProp': (function(){ var n = val('fN'); if (!n){ toast('Escribe el nombre de la propiedad'); return; } formSubmit(function(){ var k = Math.max(1, Math.min(12, +val('fU') || 1)), ty = val('fTy'), canon = money('fC') || 1500000; var pid = 'p' + (props.length + 1) + Date.now(); var units = [];
      for (var i = 0; i < k; i++) units.push({id:pid + 'u' + i, name:ty === 'Casa' ? 'Casa completa' : ty === 'Locales' ? 'Local ' + (i + 1) : 'Apto ' + (101 + i), area:60, tenant:null, canon:canon, freeD:today()});
      props.push({id:pid, name:n, short:n.replace(/^Edificio /, ''), type:ty, addr:val('fA') || 'Sin dirección', city:val('fCi'), color:['#065f46','#022c22'], units:units});
      closeSheet(); toast('Propiedad creada con ' + k + (k === 1 ? ' unidad' : ' unidades')); S.pFilter = 'all'; if (S.tab === 'propiedades') renderProps(); else go('propiedades'); }); })(); break;
    case 'loan': openSheet(loanSheet(id)); break;
    case 'sim': openSheet(simSheet); break;
    case 'simCreate': pushSheet(formSheet('Nuevo préstamo', [['fN','Nombre del deudor','text','Ej. Pedro Gaitán'],['fT','Celular','tel','300 000 0000'],['fPu','Destino del préstamo','select',[['Libre inversión','Libre inversión'],['Capital de trabajo','Capital de trabajo'],['Remodelación','Remodelación'],['Compra de vehículo','Compra de vehículo']]]], 'saveLoan', '', 'Crear préstamo de ' + fmt(SIM.P))); break;
    case 'saveLoan': (function(){ var n = val('fN'); if (!n){ toast('Escribe el nombre del deudor'); return; } formSubmit(function(){ var l = {id:'l' + Date.now(), num:'P-00' + (19 + loans.length - 7), name:n, phone:val('fT') || '300 555 0199', P:SIM.P, r:SIM.r, n:SIM.n, paid:0, purpose:val('fPu')};
      var a = amort(l.P, l.r, l.n); l.q = a.q; l.rows = a.rows; l.ti = a.ti; l.startD = today(); loans.unshift(l);
      cobros.push({id:'c' + (++cSeq), kind:'prestamo', loanId:l.id, name:n, phone:l.phone, ref:'Préstamo ' + l.num, concept:'Cuota 1 de ' + l.n, cuotaNum:1, amount:l.rows[0].q, due:addMonths(today(), 1), paid:false, paidDate:null, method:null, receipt:null});
      closeSheet(); toast('Préstamo ' + l.num + ' creado · cuota ' + fmt(l.q)); if (S.tab === 'prestamos') renderPrestamos(); else go('prestamos'); }); })(); break;
    case 'people': openSheet(peopleSheet()); break;
    case 'peopleTab': S.peopleTab = id; document.querySelectorAll('.seg button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-id') === id); }); renderPeople(); break;
    case 'person': pushSheet(personSheet(id)); break;
    case 'call': toast('Llamando a ' + id + '…'); break;
    case 'waChat': toast('Abriendo chat de WhatsApp con ' + id.split(' ')[0]); break;
    case 'gastos': openSheet(gastosSheet()); break;
    case 'addGasto': pushSheet(formSheet('Registrar gasto', [['fN','Concepto','text','Ej. Arreglo de tubería'],['fP','Propiedad','select',props.map(function(p){ return [p.id, p.name]; })],['fCa','Categoría','select',[['Reparaciones','Reparaciones'],['Administración','Administración'],['Mantenimiento','Mantenimiento'],['Impuestos','Impuestos'],['Seguros','Seguros'],['Servicios','Servicios']]],['fM','Monto','text','250.000','',true]], 'saveGasto', '', 'Guardar gasto')); break;
    case 'saveGasto': (function(){ var n = val('fN'), m = money('fM'); if (!n || !m){ toast('Completa el concepto y el monto'); return; } formSubmit(function(){ gastos.push({id:'g' + Date.now(), concepto:n, prop:val('fP'), cat:val('fCa'), monto:m, d:today(), fresh:true}); toast('Gasto de ' + fmt(m) + ' registrado'); sheetStack.pop(); paintSheet(true); if (S.tab === 'mas') renderMas(); }); })(); break;
    case 'reportes': openSheet(reportesSheet()); break;
    case 'report': (function(){ if (el.classList.contains('gen')) return; el.classList.add('gen'); var s = $('#reps' + id), b = $('#repb' + id); s.textContent = 'Generando reporte…'; setTimeout(function(){ b.style.width = '100%'; }, 30);
      setTimeout(function(){ el.classList.remove('gen'); b.style.width = '0'; s.innerHTML = '<span style="color:var(--brand-600);font-weight:700">✓ Listo · enviado a tu contador</span>'; toast(id === 'r4' ? 'CobraFacil_' + MESL[CM] + '.xlsx exportado' : 'Reporte PDF enviado a contador@restrepoasociados.co'); }, 1350); })(); break;
    case 'ajustes': openSheet(ajustesSheet()); break;
    case 'support': toast('Abriendo WhatsApp de soporte NEXUS…'); break;
    case 'toggle': S.settings[id] = !S.settings[id]; el.classList.toggle('on', S.settings[id]); toast(S.settings[id] ? 'Activado' : 'Desactivado'); break;
    case 'toastMsg': toast(id); break;
    case 'logout': closeSheet(); var lg = $('#login'); lg.classList.remove('hidden'); var lb = $('#loginBtn'); lb.disabled = false; lb.innerHTML = 'Entrar'; $('#faceSvg').innerHTML = '<path d="M8 34V20A12 12 0 0 1 20 8h14M86 8h14a12 12 0 0 1 12 12v14M112 86v14a12 12 0 0 1-12 12H86M34 112H20A12 12 0 0 1 8 100V86"/><path d="M42 44v8M78 44v8M60 44v22h-6M46 80c8 8 20 8 28 0"/>'; requestAnimationFrame(function(){ lg.classList.remove('out'); }); $('#main').setAttribute('aria-hidden', 'true'); break;
    case 'pushTap': (function(){ $('#push').classList.remove('on'); var c = cobros.filter(function(x){ return x.unitId === 'u6'; })[0]; if (c){ sheetStack = [cobroSheet(c.id), receiptSheet(c.id)]; paintSheet(false); var w = $('#sheetWrap'); w.classList.add('on'); w.setAttribute('aria-hidden', 'false'); } })(); break;
  }
});
document.addEventListener('input', function(e){
  if (e.target.id === 'cSearch'){ S.cQuery = e.target.value; renderCobrosList(); }
});
$('#screen').addEventListener('scroll', function(){ $('#hdr').classList.toggle('sc', this.scrollTop > 4); }, {passive:true});
document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && $('#sheetWrap').classList.contains('on')) closeSheet(); if (e.key === 'Enter' && !$('#login').classList.contains('out') && !$('#login').classList.contains('hidden')) doLogin(); });
document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
})();
</script>
<script id="nexus-scroll-guard">document.addEventListener("scroll",function(e){var t=e.target;if(t&&t.nodeType===1&&t.scrollTop&&getComputedStyle(t).overflowY==="hidden"){t.scrollTop=0}},true);</script>
