<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TallerPro">
<meta name="theme-color" content="#DC2626">
<title>TallerPro · Autoservicio La 80</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23DC2626'/%3E%3Ctext x='90' y='124' font-family='Arial' font-weight='800' font-size='104' text-anchor='middle' fill='white'%3ET%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%23DC2626'/%3E%3Ctext x='90' y='124' font-family='Arial' font-weight='800' font-size='104' text-anchor='middle' fill='white'%3ET%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#DC2626;--brand-600:#B91C1C;--brand-50:#FEF2F2;--brand-100:#FEE2E2;
  --char:#1F2023;--char-2:#2A2B30;--ink:#18181B;--ink-2:#3F3F46;--muted:#71717A;--muted-2:#A1A1AA;
  --line:#E7E7EA;--bg:#F4F4F5;--card:#FFFFFF;--ok:#16A34A;--warn:#D97706;--info:#2563EB;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  --hh:56px;--tb:64px;--r:16px;
  --sh:0 1px 2px rgba(24,24,27,.05),0 4px 14px rgba(24,24,27,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#D4D4D8;overscroll-behavior:none}
body{font-family:'Manrope',system-ui,-apple-system,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow:hidden;user-select:none;-webkit-user-select:none;font-size:15px;line-height:1.4}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input,select,textarea{font:inherit;color:inherit;user-select:text;-webkit-user-select:text}
svg{display:block}
#app{position:relative;max-width:430px;height:100vh;height:100dvh;margin:0 auto;background:var(--bg);overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.04),0 30px 80px rgba(0,0,0,.18)}
.ic{flex:none}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{font-variant-numeric:tabular-nums}

/* ---------- LOGIN ---------- */
#login{position:absolute;inset:0;z-index:90;background:var(--char);color:#fff;display:flex;flex-direction:column;padding:calc(var(--st) + 56px) 24px calc(var(--sb) + 24px);transition:transform .55s cubic-bezier(.7,0,.2,1),opacity .4s}
#login.hide{transform:translateY(-100%);opacity:.6;pointer-events:none}
.lg-top{flex:1;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:12px}
.logo-mark{width:60px;height:60px;border-radius:18px;background:var(--brand);display:grid;place-items:center;box-shadow:0 10px 30px rgba(220,38,38,.35)}
.lg-top h1{font-size:34px;font-weight:800;letter-spacing:-.03em;margin-top:10px}
.lg-top p{color:#A1A1AA;font-weight:500}
.lg-form{display:flex;flex-direction:column;gap:12px}
.lg-field{background:#2A2B30;border:1px solid #34353B;border-radius:14px;padding:10px 14px}
.lg-field small{display:block;color:#8B8B94;font-size:12px;font-weight:600}
.lg-field input{width:100%;background:none;border:0;outline:0;color:#fff;font-size:16px;font-weight:600;padding-top:2px}
.btn{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 18px;border-radius:14px;font-weight:700;font-size:15px;transition:transform .12s,background .2s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.block{width:100%}
.btn.primary{background:var(--brand);color:#fff;box-shadow:0 6px 18px rgba(220,38,38,.28)}
.btn.primary:active{background:var(--brand-600)}
.btn.dark{background:var(--char);color:#fff}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.soft{background:var(--brand-50);color:var(--brand)}
.btn.wa{background:#1FA855;color:#fff}
.btn.sm{height:36px;padding:0 12px;font-size:13px;border-radius:11px}
.btn.lgo{background:transparent;border:1px solid #3A3B41;color:#E4E4E7}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .7s linear infinite}
.spin.dk{border-color:rgba(0,0,0,.12);border-top-color:var(--brand)}
@keyframes spin{to{transform:rotate(360deg)}}
.lg-foot{text-align:center;color:#71717A;font-size:12px;margin-top:18px}
.lg-link{color:#A1A1AA;font-size:13px;font-weight:600;padding:6px;align-self:center}
#faceid{position:absolute;inset:0;z-index:95;background:rgba(15,15,17,.82);display:none;place-items:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#faceid.show{display:grid}
.fid-box{width:170px;height:170px;border-radius:36px;background:#202125;display:grid;place-items:center;color:#fff;position:relative;overflow:hidden}
.fid-box .scan{position:absolute;left:0;right:0;height:3px;background:#4ADE80;box-shadow:0 0 18px #4ADE80;animation:scan 1.1s ease-in-out infinite alternate}
@keyframes scan{from{top:18%}to{top:80%}}
.fid-box.ok{color:#4ADE80}.fid-box.ok .scan{display:none}

/* ---------- SHELL ---------- */
#shell{position:absolute;inset:0;transition:transform .35s cubic-bezier(.3,.7,.2,1),filter .35s}
#shell.pushed{transform:translateX(-22%);filter:brightness(.92)}
.hdr{position:absolute;top:0;left:0;right:0;z-index:5;height:calc(var(--hh) + var(--st));padding:var(--st) 12px 0 18px;display:flex;align-items:center;gap:10px;background:rgba(244,244,245,.88);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid transparent;transition:border-color .2s}
.hdr.sc{border-bottom-color:var(--line)}
.hdr .ttl{flex:1;min-width:0}
.hdr .ttl b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.hdr .ttl small{display:block;font-size:12.5px;color:var(--muted);font-weight:600}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;position:relative;color:var(--ink-2);transition:background .15s,transform .12s}
.iconbtn:active{background:rgba(0,0,0,.06);transform:scale(.94)}
.iconbtn.fill{background:var(--brand);color:#fff}
.badge{position:absolute;top:6px;right:6px;min-width:16px;height:16px;border-radius:8px;background:var(--brand);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px;border:2px solid var(--bg)}
#screen{position:absolute;top:calc(var(--hh) + var(--st));bottom:calc(var(--tb) + var(--sb));left:0;right:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:6px 16px 28px}
#screen.fill{overflow:hidden;padding:0;display:flex;flex-direction:column}
.fadein{animation:fadein .35s ease both}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:6;height:calc(var(--tb) + var(--sb));padding-bottom:var(--sb);display:flex;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted-2);transition:color .2s}
.tab .ti{width:46px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .25s,transform .2s}
.tab.on{color:var(--brand)}
.tab.on .ti{background:var(--brand-50)}
.tab:active .ti{transform:scale(.9)}

/* ---------- GENERIC ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:12px}
.sec{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:800;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em;margin:20px 2px 10px}
.sec .lnk{font-size:13px;color:var(--brand);text-transform:none;letter-spacing:0;font-weight:700}
.pill{--c:#64748B;display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:13px;font-size:12px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 12%,white);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.pill.nodot::before{display:none}
.av{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;flex:none;background:var(--c,#3F3F46)}
.av.sm{width:24px;height:24px;border-radius:8px;font-size:10px}
.av.lg{width:48px;height:48px;border-radius:15px;font-size:16px}
.plate{display:inline-flex;flex-direction:column;align-items:center;background:#F7D117;border:2px solid #111;border-radius:6px;padding:1px 7px 1px;line-height:1;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);flex:none}
.plate b{font-family:'Manrope',sans-serif;font-weight:800;font-size:15px;letter-spacing:.06em;color:#111}
.plate i{font-style:normal;font-size:5.5px;font-weight:800;letter-spacing:.12em;color:#111;margin-top:1px}
.plate.lg{padding:3px 12px;border-width:2.5px;border-radius:8px}
.plate.lg b{font-size:24px}.plate.lg i{font-size:7.5px}
.plate.xl{padding:4px 16px;border-width:3px;border-radius:9px}
.plate.xl b{font-size:30px}.plate.xl i{font-size:9px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;height:34px;padding:0 13px;border-radius:17px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;transition:all .15s}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--char);border-color:var(--char);color:#fff}
.chip .cnt{font-size:11px;opacity:.7}
.search{display:flex;align-items:center;gap:8px;height:46px;padding:0 14px;background:#fff;border:1px solid var(--line);border-radius:14px;color:var(--muted);box-shadow:var(--sh)}
.search input{flex:1;border:0;outline:0;background:none;font-size:15px;font-weight:600;color:var(--ink);min-width:0}
.search input::placeholder{color:var(--muted-2);font-weight:500}
.search .clr{color:var(--muted-2)}
.list .li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.list .li:last-child{border-bottom:0}
.list .li:active{opacity:.7}
.li b{font-weight:700;font-size:14.5px;display:block}
.li small{color:var(--muted);font-size:12.5px;font-weight:500;display:block}
.empty{text-align:center;color:var(--muted);padding:28px 10px;font-weight:600}
.empty .ei{width:52px;height:52px;border-radius:16px;background:#fff;display:grid;place-items:center;margin:0 auto 10px;color:var(--muted-2);box-shadow:var(--sh)}
.tog{width:46px;height:28px;border-radius:14px;background:#D4D4D8;position:relative;transition:background .2s;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .22s cubic-bezier(.3,.7,.3,1.3)}
.tog.on{background:var(--ok)}
.tog.on::after{transform:translateX(18px)}
.seg{display:flex;background:#E4E4E7;border-radius:12px;padding:3px}
.seg button{flex:1;height:34px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.hscroll{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -16px;padding:2px 16px 4px}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{scroll-snap-align:start}

/* skeleton */
.sk{background:linear-gradient(90deg,#E9E9EC 0%,#F4F4F6 50%,#E9E9EC 100%);background-size:200% 100%;animation:sk 1.1s linear infinite;border-radius:14px}
@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}

/* ---------- HOME ---------- */
.hero{background:var(--char);color:#fff;border-radius:20px;padding:18px;position:relative;overflow:hidden;margin-bottom:12px}
.hero small{color:#A1A1AA;font-weight:600;font-size:13px}
.hero .big{font-size:52px;font-weight:800;letter-spacing:-.04em;line-height:1;margin:6px 0 4px}
.hero .big span{font-size:16px;font-weight:600;color:#A1A1AA;letter-spacing:0;margin-left:6px}
.hero .hcar{position:absolute;right:-12px;bottom:30px;width:150px;opacity:.95}
.hero .tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;background:#2E2F35;padding:5px 10px;border-radius:10px;color:#E4E4E7}
.hero .tag i{width:7px;height:7px;border-radius:50%;background:#4ADE80;box-shadow:0 0 0 3px rgba(74,222,128,.2)}
.stgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.stc{background:#fff;border-radius:14px;padding:10px 4px 9px;text-align:center;box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;gap:3px;transition:transform .12s}
.stc:active{transform:scale(.95)}
.stc b{font-size:22px;font-weight:800;color:var(--c);line-height:1.1}
.stc span{font-size:9.5px;font-weight:700;color:var(--muted);line-height:1.15}
.stc i{width:22px;height:4px;border-radius:2px;background:var(--c);opacity:.9}
.money{font-size:30px;font-weight:800;letter-spacing:-.03em}
.up{color:var(--ok);font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:3px}
.bars rect.b{transform-box:fill-box;transform-origin:50% 100%;animation:grow .8s cubic-bezier(.3,.7,.2,1) both}
@keyframes grow{from{transform:scaleY(0)}}
.load{display:flex;align-items:center;gap:12px;padding:9px 0}
.load .bar{height:8px;border-radius:4px;background:#F0F0F2;overflow:hidden;margin-top:6px}
.load .bar i{display:block;height:100%;border-radius:4px;width:0;transition:width 1s cubic-bezier(.3,.7,.2,1)}
.load .pc{font-size:12px;font-weight:800;color:var(--ink-2);width:38px;text-align:right}
.dl{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.dl:last-child{border-bottom:0}
.dl .tm{width:56px;flex:none;font-weight:800;font-size:13px;line-height:1.1}
.dl .tm small{display:block;color:var(--muted);font-weight:600;font-size:11px}
.promo{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:linear-gradient(0deg,#fff,#fff);border:1.5px dashed #F3B4B4;border-radius:var(--r);padding:14px;margin-top:6px}
.promo .pi{width:44px;height:44px;border-radius:14px;background:var(--brand-50);color:var(--brand);display:grid;place-items:center;flex:none}

/* ---------- KANBAN ---------- */
.ord-top{padding:6px 16px 10px;flex:none}
.hint{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px;margin-top:8px}
#board{flex:1;min-height:0;display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;padding:0 16px 14px;scrollbar-width:none;scroll-padding:0 16px}
#board::-webkit-scrollbar{display:none}
.col{flex:none;width:calc(100% - 52px);max-width:340px;height:100%;display:flex;flex-direction:column;background:#EAEAEC;border-radius:18px;scroll-snap-align:start}
.col-h{display:flex;align-items:center;gap:8px;padding:12px 14px 8px;font-weight:800;font-size:14px}
.col-h .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.col-h .n{margin-left:auto;font-size:12px;background:#fff;border-radius:9px;padding:2px 8px;color:var(--ink-2)}
.col-b{flex:1;overflow-y:auto;padding:2px 10px 12px;overscroll-behavior:contain}
.col-b::-webkit-scrollbar{display:none}
.kcard{display:block;width:100%;text-align:left;background:#fff;border-radius:14px;padding:12px;margin-bottom:9px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);border-left:4px solid var(--c);transition:transform .12s}
.kcard:active{transform:scale(.98)}
.kcard .mdl{font-weight:800;font-size:14.5px;margin-top:9px}
.kcard .cli{font-size:12.5px;color:var(--muted);font-weight:600}
.kcard .ft{display:flex;align-items:center;gap:7px;margin-top:10px;padding-top:9px;border-top:1px solid #F1F1F3;font-size:12px;font-weight:700;color:var(--ink-2)}
.kcard .tmr{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
.ktag{font-size:10.5px;font-weight:800;padding:3px 7px;border-radius:7px;background:var(--brand-50);color:var(--brand)}
.ktag.ok{background:#DCFCE7;color:#15803D}
.kcard.leaving{animation:leave .38s cubic-bezier(.5,0,.8,.4) forwards}
@keyframes leave{to{transform:translateX(60px) scale(.85) rotate(4deg);opacity:0}}
.kcard.arrived{animation:arrive .7s cubic-bezier(.2,.8,.2,1.2) both,ring 1.8s ease .5s}
@keyframes arrive{0%{transform:translateX(-70px) scale(.85) rotate(-4deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(220,38,38,.5)}70%{box-shadow:0 0 0 12px rgba(220,38,38,0)}100%{box-shadow:0 1px 2px rgba(0,0,0,.05)}}
.col-empty{border:1.5px dashed #D4D4D8;border-radius:14px;padding:22px 10px;text-align:center;color:var(--muted-2);font-size:13px;font-weight:600}

/* ---------- PAGES ---------- */
#pages{position:absolute;inset:0;z-index:30;pointer-events:none}
.page{position:absolute;inset:0;background:var(--bg);transform:translateX(100%);transition:transform .35s cubic-bezier(.3,.7,.2,1);pointer-events:auto;display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(0,0,0,.08)}
.page.in{transform:none}
.phdr{flex:none;height:calc(var(--hh) + var(--st));padding:var(--st) 10px 0 6px;display:flex;align-items:center;gap:4px;background:rgba(244,244,245,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.phdr .pt{flex:1;min-width:0}
.phdr .pt b{display:block;font-size:17px;font-weight:800;letter-spacing:-.01em}
.phdr .pt small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.pbody{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 16px 28px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.pfoot{flex:none;padding:10px 16px calc(10px + var(--sb));background:rgba(255,255,255,.95);border-top:1px solid var(--line);display:flex;gap:10px}
.pfoot:empty{display:none}
.pfoot .btn{flex:1;white-space:nowrap;font-size:14.5px;padding:0 12px}

/* order detail */
.od-hero h2{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:12px}
.stepper{display:flex;margin-top:16px;position:relative}
.stp{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;font-size:9.5px;font-weight:700;color:var(--muted-2);text-align:center;line-height:1.15}
.stp i{width:14px;height:14px;border-radius:50%;background:#E4E4E7;position:relative;z-index:1;border:3px solid #fff;box-shadow:0 0 0 1px #E4E4E7}
.stp::before{content:"";position:absolute;top:6px;left:-50%;width:100%;height:3px;background:#E4E4E7}
.stp:first-child::before{display:none}
.stp.done i,.stp.cur i{background:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.stp.done::before,.stp.cur::before{background:var(--brand)}
.stp.cur{color:var(--ink)}
.stp.cur i{box-shadow:0 0 0 5px rgba(220,38,38,.18)}
.stp.done{color:var(--ink-2)}
.approved{margin-top:12px;display:flex;align-items:center;gap:8px;background:#DCFCE7;color:#166534;font-weight:700;font-size:13px;padding:10px 12px;border-radius:12px}
.rx{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rx>div{background:#F7F7F8;border-radius:14px;padding:12px}
.rx small{display:block;color:var(--muted);font-size:12px;font-weight:700}
.rx b{font-size:20px;font-weight:800;letter-spacing:-.02em}
.fuel{width:100%;max-width:120px;margin:0 auto}
.fuel .ndl{transform-origin:50px 52px;animation:needle 1.2s cubic-bezier(.3,.7,.2,1.2) .2s both}
@keyframes needle{from{transform:rotate(-90deg)}to{transform:rotate(var(--a))}}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.chk{display:flex;align-items:center;gap:8px;height:40px;padding:0 10px;border-radius:12px;background:#F7F7F8;font-size:13px;font-weight:700;color:var(--muted);text-align:left}
.chk .cb{width:20px;height:20px;border-radius:6px;border:2px solid #D4D4D8;display:grid;place-items:center;color:transparent;flex:none;transition:all .15s}
.chk.on{color:var(--ink)}
.chk.on .cb{background:var(--ok);border-color:var(--ok);color:#fff}
.dmg-wrap{display:flex;gap:14px;align-items:center;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.dmg-wrap svg{width:78px;flex:none}
.dmg-wrap ul{list-style:none;flex:1;display:flex;flex-direction:column;gap:8px}
.dmg-wrap li{display:flex;gap:8px;align-items:flex-start;font-size:13px;font-weight:600;color:var(--ink-2)}
.dmg-wrap li b{width:20px;height:20px;border-radius:50%;background:var(--brand);color:#fff;font-size:11px;display:grid;place-items:center;flex:none}
.sigbox{border:1.5px dashed #D4D4D8;border-radius:14px;padding:12px;display:flex;align-items:center;gap:12px}
.sigbox img,.sigbox svg.sg{height:56px;width:140px;object-fit:contain;flex:none;background:#FAFAFA;border-radius:10px}
.sigbox.miss{border-color:#F3B4B4;background:var(--brand-50)}
.photo{flex:none;width:150px;border-radius:14px;overflow:hidden;background:#fff;box-shadow:var(--sh);text-align:left}
.photo svg{width:100%;height:104px}
.photo span{display:block;padding:7px 10px 8px;font-size:12px;font-weight:700}
.photo span small{display:block;font-weight:600;color:var(--muted);font-size:11px}
.photo.add{display:grid;place-items:center;min-height:140px;background:#fff;border:1.5px dashed #D4D4D8;box-shadow:none;color:var(--muted);font-weight:700;font-size:13px;gap:4px}
.photo.new{animation:pop .45s cubic-bezier(.2,.8,.3,1.3)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.it{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.it .ii{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none;background:#F4F4F5;color:var(--ink-2)}
.it .ii.j{background:var(--brand-50);color:var(--brand)}
.it b{font-size:14px;font-weight:700;display:block}
.it small{font-size:12px;color:var(--muted);font-weight:600}
.it .pr{font-weight:800;font-size:14px;white-space:nowrap}
.tot{padding-top:10px}
.tot div{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600;color:var(--muted);padding:3px 0}
.tot div.g{color:var(--ink);font-size:18px;font-weight:800;padding-top:8px;margin-top:6px;border-top:1px solid var(--line)}
.qty{display:flex;align-items:center;gap:2px;background:#F4F4F5;border-radius:10px}
.qty button{width:28px;height:28px;display:grid;place-items:center;border-radius:9px;color:var(--ink-2)}
.qty button:active{background:#E4E4E7}
.qty span{min-width:18px;text-align:center;font-weight:800;font-size:13px}
.flash{animation:flash .8s ease}
@keyframes flash{0%{background:var(--brand-100)}100%{background:transparent}}

/* timeline */
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-i{position:relative;padding:0 0 18px;width:100%;text-align:left;display:block}
.tl-i:last-child{padding-bottom:0}
.tl-i::before{content:"";position:absolute;left:-23px;top:4px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--muted-2)}
.tl-i.cur::before{border-color:var(--brand);box-shadow:0 0 0 4px rgba(220,38,38,.15)}
.tl-i.oil::before{border-color:var(--warn)}
.tl-i small{color:var(--muted);font-size:12px;font-weight:700}
.tl-i b{display:block;font-size:14.5px;font-weight:700;margin:1px 0}
.tl-i p{font-size:12.5px;color:var(--muted);font-weight:600}
.oilbar{height:8px;border-radius:4px;background:#F0F0F2;overflow:hidden;margin:8px 0 6px}
.oilbar i{display:block;height:100%;border-radius:4px;width:0;transition:width .9s cubic-bezier(.3,.7,.2,1)}
.ok-c{color:var(--ok)}.warn-c{color:var(--warn)}.bad-c{color:var(--brand)}
.vcard{display:block;width:100%;text-align:left}
.vcard:active{transform:scale(.99)}
.ring{width:110px;height:110px;flex:none}
.ring circle.p{transition:stroke-dashoffset 1.1s cubic-bezier(.3,.7,.2,1)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats>div{background:#fff;border-radius:14px;padding:12px;box-shadow:var(--sh)}
.stats small{display:block;font-size:11.5px;color:var(--muted);font-weight:700}
.stats b{font-size:16px;font-weight:800}

/* quote */
.qveh{display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.qres .li .add{width:34px;height:34px;border-radius:11px;background:var(--brand);color:#fff;display:grid;place-items:center;flex:none;transition:transform .15s}
.qres .li .add:active{transform:scale(.88)}
.stock-lo{color:var(--brand);font-weight:700}
.sticky-tot{position:sticky;bottom:0;margin:0 -16px;padding:12px 16px 6px;background:linear-gradient(180deg,rgba(244,244,245,0),var(--bg) 18%)}
.sticky-tot .card{margin-bottom:10px}
.btnrow{display:flex;gap:10px}
.btnrow .btn{flex:1}

/* pdf */
.paper-wrap{background:#52525B;margin:0 -18px;padding:18px;border-radius:0}
.paper{background:#fff;border-radius:4px;padding:22px 18px;box-shadow:0 10px 30px rgba(0,0,0,.35);font-size:11px;color:#27272A;user-select:text}
.paper .ph{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding-bottom:12px;border-bottom:3px solid var(--brand)}
.paper .lg{display:flex;align-items:center;gap:8px}
.paper .lg>div:first-child{width:34px;height:34px;border-radius:9px;background:var(--brand);display:grid;place-items:center}
.paper h4{font-size:14px;font-weight:800;letter-spacing:-.01em}
.paper .meta{font-size:9.5px;color:#71717A;line-height:1.45}
.paper .doc{text-align:right}
.paper .doc b{display:block;font-size:13px;font-weight:800;color:var(--brand);letter-spacing:.04em}
.paper .two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.paper .two div{background:#F7F7F8;border-radius:6px;padding:8px}
.paper .two small{display:block;font-size:8.5px;text-transform:uppercase;letter-spacing:.08em;color:#A1A1AA;font-weight:800}
.paper table{width:100%;border-collapse:collapse}
.paper th{font-size:8.5px;text-transform:uppercase;letter-spacing:.06em;color:#fff;background:var(--char);padding:6px;text-align:left}
.paper th:last-child,.paper td:last-child{text-align:right}
.paper td{padding:6px;border-bottom:1px solid #EEE;font-size:10.5px}
.paper .pt-tot{margin-left:auto;width:60%;margin-top:8px}
.paper .pt-tot div{display:flex;justify-content:space-between;padding:2px 0}
.paper .pt-tot .g{background:var(--brand);color:#fff;font-weight:800;font-size:12.5px;padding:6px 8px;border-radius:5px;margin-top:4px}
.paper .notes{margin-top:14px;font-size:9.5px;color:#71717A;line-height:1.5}
.paper .sgl{display:flex;justify-content:space-between;margin-top:22px;gap:20px}
.paper .sgl div{flex:1;border-top:1px solid #A1A1AA;padding-top:4px;font-size:9px;color:#71717A;text-align:center}
.paper .pf{margin-top:14px;text-align:center;font-size:8.5px;color:#A1A1AA}

/* whatsapp */
.wa-chat{margin:0 -18px;background:#EFE7DD;padding:14px 14px 18px;min-height:300px}
.wa-h{display:flex;align-items:center;gap:10px;background:#075E54;color:#fff;margin:-14px -14px 14px;padding:12px 14px}
.wa-h small{display:block;font-size:11.5px;opacity:.8}
.bub{background:#DCF8C6;margin-left:auto;max-width:86%;border-radius:12px 12px 2px 12px;padding:8px 10px 5px;margin-bottom:8px;box-shadow:0 1px 1px rgba(0,0,0,.1);font-size:13.5px;animation:fadein .4s both}
.bub .f{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.05);border-radius:8px;padding:9px;margin-bottom:6px}
.bub .f i{width:32px;height:38px;border-radius:4px;background:var(--brand);color:#fff;font-style:normal;font-size:9px;font-weight:800;display:grid;place-items:center;flex:none}
.bub .m{text-align:right;font-size:10.5px;color:#667781;margin-top:2px}
.ticks{color:#8696A0;font-weight:800;letter-spacing:-3px;transition:color .3s}
.ticks.read{color:#34B7F1}
.bub a{color:#027EB5;font-weight:600;text-decoration:none}

/* ---------- SHEET ---------- */
#sheetLayer{position:absolute;inset:0;z-index:50;pointer-events:none}
#sheetLayer .bd{position:absolute;inset:0;background:rgba(15,15,17,.45);opacity:0;transition:opacity .3s}
#sheetLayer.open{pointer-events:auto}
#sheetLayer.open .bd{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;background:#fff;border-radius:22px 22px 0 0;transform:translateY(105%);transition:transform .38s cubic-bezier(.3,.8,.2,1);display:flex;flex-direction:column}
#sheetLayer.open .sheet{transform:none}
.sheet .grab{flex:none;padding:9px 0 4px;display:grid;place-items:center}
.sheet .grab i{width:38px;height:5px;border-radius:3px;background:#D4D4D8}
.sheet .sbody{overflow-y:auto;padding:6px 18px calc(18px + var(--sb));overscroll-behavior:contain}
.sh-title{font-size:19px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
.sh-sub{color:var(--muted);font-size:13px;font-weight:600;margin-bottom:14px}
.form{display:flex;flex-direction:column;gap:12px}
.form label,.form .lbl{font-size:12.5px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.form input,.form select{height:48px;border-radius:13px;border:1px solid var(--line);background:#FAFAFA;padding:0 14px;font-size:15.5px;font-weight:600;color:var(--ink);outline:0;transition:border .15s,box-shadow .15s;width:100%}
.form input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(220,38,38,.12);background:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sigpad{position:relative;border:1.5px solid var(--line);border-radius:16px;background:#FCFCFC;overflow:hidden}
.sigpad canvas{display:block;width:100%;height:210px;touch-action:none;cursor:crosshair}
.sigpad .ln{position:absolute;left:22px;right:22px;bottom:44px;border-top:1.5px dashed #D4D4D8;pointer-events:none}
.sigpad .x{position:absolute;left:18px;bottom:48px;font-size:18px;color:#D4D4D8;font-weight:800;pointer-events:none}
.sigpad .ph{position:absolute;inset:0;display:grid;place-items:center;color:#C4C4CA;font-weight:700;font-size:14px;pointer-events:none;transition:opacity .2s}
.sigpad.inked .ph{opacity:0}
.legal{font-size:12px;color:var(--muted);font-weight:500;line-height:1.5;margin:10px 0 14px}

/* ---------- TOAST / PUSH ---------- */
#toast{position:absolute;left:50%;bottom:calc(var(--tb) + var(--sb) + 14px);z-index:120;transform:translate(-50%,20px);opacity:0;background:var(--char);color:#fff;padding:12px 16px;border-radius:14px;font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:9px;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:all .3s cubic-bezier(.3,.8,.3,1.2);pointer-events:none;width:max-content;max-width:calc(100% - 32px)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast .ti{width:22px;height:22px;border-radius:50%;background:var(--ok);display:grid;place-items:center;flex:none}
#push{position:absolute;left:10px;right:10px;width:calc(100% - 20px);top:calc(var(--st) + 8px);z-index:130;background:rgba(250,250,250,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:20px;padding:12px 14px;box-shadow:0 12px 40px rgba(0,0,0,.28);transform:translateY(-150%);transition:transform .5s cubic-bezier(.2,.9,.3,1.15);text-align:left;width:auto;display:block}
#push.show{transform:none}
#push .pa{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
#push .pa i{width:20px;height:20px;border-radius:6px;background:var(--brand);color:#fff;font-style:normal;font-size:11px;font-weight:800;display:grid;place-items:center}
#push .pa span{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:600}
#push b{display:block;font-size:14.5px;font-weight:800;margin-top:6px}
#push p{font-size:13.5px;color:var(--ink-2);font-weight:500}

/* ---------- TRACKING (cliente) ---------- */
#tracking{position:absolute;inset:0;z-index:60;background:#F6F6F7;transform:translateY(100%);transition:transform .5s cubic-bezier(.3,.8,.2,1);display:flex;flex-direction:column}
#tracking.open{transform:none}
.trk-bar{flex:none;padding:calc(var(--st) + 6px) 12px 8px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.trk-url{flex:1;height:34px;border-radius:11px;background:#F0F0F2;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2)}
.trk-x{height:34px;padding:0 12px;border-radius:11px;background:var(--char);color:#fff;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:5px}
.trk-flag{flex:none;background:#FEF3C7;color:#92400E;font-size:11.5px;font-weight:700;text-align:center;padding:5px}
.trk-body{flex:1;overflow-y:auto;padding:16px 16px 34px;overscroll-behavior:contain}
.trk-brand{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.trk-brand .m{width:38px;height:38px;border-radius:12px;background:var(--brand);display:grid;place-items:center}
.trk-hero{background:var(--char);color:#fff;border-radius:22px;padding:18px;position:relative;overflow:hidden}
.trk-hero h2{font-size:23px;font-weight:800;letter-spacing:-.02em;line-height:1.2;margin:6px 0 10px;max-width:92%}
.trk-hero small{color:#A1A1AA;font-weight:600}
.eta{display:inline-flex;align-items:center;gap:7px;background:#2E2F35;border-radius:11px;padding:7px 11px;font-size:13px;font-weight:700}
.eta i{width:8px;height:8px;border-radius:50%;background:#4ADE80;animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(74,222,128,.6)}100%{box-shadow:0 0 0 10px rgba(74,222,128,0)}}
.track{position:relative;height:44px;margin:20px 6px 4px}
.track .rail{position:absolute;left:0;right:0;top:20px;height:6px;border-radius:3px;background:#3A3B41}
.track .fill{position:absolute;left:0;top:20px;height:6px;border-radius:3px;background:var(--brand);width:0;transition:width 1.6s cubic-bezier(.4,.1,.2,1)}
.track .nd{position:absolute;top:16px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#3A3B41;border:3px solid var(--char);transition:background .3s}
.track .nd.on{background:var(--brand)}
.track .car{position:absolute;top:-2px;left:0;margin-left:-19px;width:38px;height:24px;transition:left 1.6s cubic-bezier(.4,.1,.2,1)}
.trk-steps{background:#fff;border-radius:20px;padding:16px;margin-top:12px;box-shadow:var(--sh)}
.ts{display:flex;gap:12px;position:relative;padding-bottom:16px}
.ts:last-child{padding-bottom:0}
.ts::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:#ECECEE}
.ts:last-child::before{display:none}
.ts .c{width:24px;height:24px;border-radius:50%;background:#ECECEE;display:grid;place-items:center;color:#fff;flex:none;position:relative;z-index:1}
.ts.done .c{background:var(--ok)}
.ts.done::before{background:var(--ok)}
.ts.cur .c{background:var(--brand);animation:pulse2 1.6s infinite}
@keyframes pulse2{0%{box-shadow:0 0 0 0 rgba(220,38,38,.5)}100%{box-shadow:0 0 0 10px rgba(220,38,38,0)}}
.ts b{display:block;font-size:14.5px;font-weight:800}
.ts small{font-size:12.5px;color:var(--muted);font-weight:600}
.ts.todo b{color:var(--muted-2)}
.qbox{background:#fff;border-radius:20px;padding:16px;margin-top:12px;box-shadow:var(--sh);border:2px solid var(--brand-100)}
.qbox.ok{border-color:#BBF7D0}
.apv{height:56px;font-size:16px;border-radius:16px;margin-top:14px}
.apv.done{background:var(--ok)!important;box-shadow:0 6px 18px rgba(22,163,74,.3)}
.confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app">

  <!-- LOGIN -->
  <section id="login" aria-label="Iniciar sesión">
    <div class="lg-top">
      <div class="logo-mark"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18v3h3l6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg></div>
      <h1>TallerPro</h1>
      <p>Autoservicio La 80 · Bogotá</p>
    </div>
    <form class="lg-form" id="loginForm" autocomplete="off">
      <div class="lg-field"><small>Correo</small><input type="email" value="hernan@autoservicio80.co" aria-label="Correo" readonly></div>
      <div class="lg-field"><small>Contraseña</small><input type="password" value="tallerpro2026" aria-label="Contraseña" readonly></div>
      <button class="btn primary block" type="submit" id="loginBtn" aria-label="Entrar">Entrar</button>

        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M9 9v1.5M15 9v1.5M12 9v4h-1M9 16c1.6 1.2 4.4 1.2 6 0"/></svg>
        Entrar con Face ID</button>
      <button class="lg-link" type="button" data-act="forgot">¿Olvidaste tu contraseña?</button>

    <svg width="74" height="74" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M9 9v1.5M15 9v1.5M12 9v4h-1M9 16c1.6 1.2 4.4 1.2 6 0"/></svg></div></div>

  <!-- SHELL -->
  <div id="shell">
    <header class="hdr" id="hdr">
      <div class="ttl"><b id="hTitle">Inicio</b><small id="hSub"></small></div>
      <div id="hActions" class="row" style="gap:2px"></div>
    </header>
    <main id="screen" aria-live="polite"></main>
    <nav class="tabbar" aria-label="Navegación principal">
      <button class="tab on" data-tab="home" aria-label="Inicio"><span class="ti" data-i="home"></span>Inicio</button>
      <button class="tab" data-tab="orders" aria-label="Órdenes"><span class="ti" data-i="orders"></span>Órdenes</button>
      <button class="tab" data-tab="vehicles" aria-label="Vehículos"><span class="ti" data-i="car"></span>Vehículos</button>
      <button class="tab" data-tab="quote" aria-label="Cotizar"><span class="ti" data-i="quote"></span>Cotizar</button>
      <button class="tab" data-tab="more" aria-label="Más"><span class="ti" data-i="more"></span>Más</button>
    </nav>

  <div id="pages"></div>
  <section id="tracking" aria-label="Vista del cliente"></section>
  <div id="sheetLayer"><div class="bd" data-act="closeSheet"></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"><i></i></div><div class="sbody" id="sbody"></div></div></div>
  <div id="toast" role="status"><span class="ti"></span><span id="toastTxt"></span></div>
  <button id="push" data-act="pushTap" aria-label="Notificación"></button>

async function advance(o){
 const i=ST[o.status].i;
 if(i>=4){
  await popPage();if(state.tab!=='orders')await setTab('orders');
  scrollToCol('listo');const c=$(`#board [data-id="${o.id}"]`);if(c){c.classList.add('leaving');await wait(380);}
  o.status='entregado';renderBoard();toast(o.plate+' entregado a '+firstName(o.client)+' ✓');return;
 }
 const next=STATUSES[i+1].k;
 await popPage();await popAll();
 if(state.tab!=='orders')await setTab('orders');
 if(state.filterTech!=='all'&&state.filterTech!==o.tech){state.filterTech='all';$$('#techChips .chip').forEach(c=>c.classList.toggle('on',c.dataset.v==='all'));renderBoard();}
 scrollToCol(o.status);
 await wait(200);
 const c=$(`#board [data-id="${o.id}"]`);if(c){c.classList.add('leaving');await wait(380);}
 o.status=next;o.updatedAt=Date.now();
 renderBoard();scrollToCol(next,true);
 const nc=$(`#board [data-id="${o.id}"]`);if(nc){nc.classList.add('arrived');const cb=nc.closest('.col-b');if(cb)cb.scrollTop=0;}
 toast(o.plate+' → '+ST[next].label);
 setTimeout(()=>toast('📲 Se avisó a '+firstName(o.client)+' por WhatsApp','wa'),2000);
}

function openSignature(o){
 openSheet(`<h3 class="sh-title">Firma de recepción</h3><div class="sh-sub">${esc(o.plate)} · ${esc(o.brand)} ${esc(o.model)} · ${dots(o.km)} km</div>
  <div class="sigpad" id="sigpad"><canvas id="sigCanvas" aria-label="Área de firma"></canvas><div class="ln"></div><div class="x">✕</div><div class="ph">Firme aquí con el dedo</div></div>
  <p class="legal">Yo, <b>${esc(o.client)}</b>, declaro que entrego el vehículo en el estado descrito (gasolina ${Math.round(o.fuel*100)}%, ${o.damages.length} daño(s) registrados) y autorizo el diagnóstico. Firma con validez según Ley 527 de 1999.</p>
  <div class="btnrow"><button class="btn ghost" data-act="sigClear">${ic('trash',18)}Borrar</button><button class="btn primary" data-act="sigSave" data-id="${o.id}">${ic('check',18,2.4)}Guardar firma</button></div>`,
 {onMount:b=>{sigPad=setupSignature($('#sigCanvas',b),()=>$('#sigpad').classList.add('inked'));}});
}
let sigPad=null;
function setupSignature(cv,onInk){
 const ctx=cv.getContext('2d'),dpr=Math.max(1,window.devicePixelRatio||1);const r=cv.getBoundingClientRect();
 cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);ctx.scale(dpr,dpr);
 ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#111827';ctx.fillStyle='#111827';
 let drawing=false,last=null,mid=null,inked=false,lastT=0,lw=2.6;
 const pos=e=>{const b=cv.getBoundingClientRect();return{x:e.clientX-b.left,y:e.clientY-b.top};};
 cv.addEventListener('pointerdown',e=>{e.preventDefault();drawing=true;try{cv.setPointerCapture(e.pointerId);}catch(_){}last=pos(e);mid=null;lastT=performance.now();ctx.beginPath();ctx.arc(last.x,last.y,1.3,0,Math.PI*2);ctx.fill();if(!inked){inked=true;onInk();}});
 cv.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();const p=pos(e),now=performance.now();const dist=Math.hypot(p.x-last.x,p.y-last.y);if(dist<1)return;const v=dist/Math.max(1,now-lastT);const target=Math.max(1.4,Math.min(3.4,3.6-v*1.4));lw=lw*.7+target*.3;ctx.lineWidth=lw;const m={x:(last.x+p.x)/2,y:(last.y+p.y)/2};ctx.beginPath();ctx.moveTo(mid?mid.x:last.x,mid?mid.y:last.y);ctx.quadraticCurveTo(last.x,last.y,m.x,m.y);ctx.stroke();mid=m;last=p;lastT=now;});
 const end=()=>{drawing=false;mid=null;};cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);cv.addEventListener('pointerleave',end);
 return{clear(){ctx.clearRect(0,0,r.width,r.height);inked=false;$('#sigpad').classList.remove('inked');},has:()=>inked,data:()=>cv.toDataURL('image/png')};
}

function confetti(host,ox,oy){
 const cv=document.createElement('canvas');cv.className='confetti';host.appendChild(cv);
 const dpr=Math.max(1,window.devicePixelRatio||1),W=host.clientWidth,Hh=host.clientHeight;cv.width=W*dpr;cv.height=Hh*dpr;const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
 const cols=['#DC2626','#F59E0B','#16A34A','#2563EB','#F7D117','#27272A'];
 const ps=Array.from({length:90},()=>({x:ox+(Math.random()-.5)*60,y:oy,vx:(Math.random()-.5)*9,vy:-(6+Math.random()*9),w:4+Math.random()*5,h:6+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.floor(Math.random()*cols.length)]}));
 const t0=performance.now();
 const step=t=>{const el=t-t0;ctx.clearRect(0,0,W,Hh);const a=el>1500?Math.max(0,1-(el-1500)/700):1;ctx.globalAlpha=a;
  ps.forEach(p=>{p.vy+=.32;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.r*2)));ctx.restore();});
  if(el<2200)requestAnimationFrame(step);else cv.remove();};
 requestAnimationFrame(step);
}

 newClient:()=>openSheet(`<h3 class="sh-title">Nuevo cliente</h3><form class="form" id="ncForm" style="margin-top:10px"><label>Nombre completo<input name="n" required value="Valentina Ortiz"></label><label>Celular<input name="p" inputmode="tel" required value="319 552 0874"></label><label>Placa del vehículo<input name="pl" maxlength="7" value="JQK 381" style="text-transform:uppercase"></label><button class="btn primary block" type="submit">Guardar cliente</button></form>`,{onMount:b=>{$('#ncForm',b).addEventListener('submit',e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const pl=fmtPlate(f.pl||'');if(pl&&!vehicle(pl))vehicles.unshift(mkVehicle(pl,'Renault','Kwid',2021,'Blanco',f.n.trim(),f.p.trim(),30200));clients=buildClients();if(!clients.find(c=>c.name===f.n.trim()))clients.unshift({name:f.n.trim(),phone:f.p.trim(),plates:[],visits:0,spent:0,last:Date.now()});state.cq='';closeSheet();topPage().refresh();toast('Cliente '+f.n.trim()+' guardado');});}}),
 repSeg:el=>{state.rep=el.dataset.k;topPage().refresh();},
 exportRep:()=>toast('Reporte_'+state.rep+'.xlsx exportado'),
 toggle:el=>{const on=!el.classList.contains('on');el.classList.toggle('on',on);el.setAttribute('aria-checked',on);const s=SETTINGS.find(x=>x[0]===el.dataset.k);if(s)s[2]=on;toast(on?'Activado':'Desactivado');},
 editField:el=>toast('Editar '+el.dataset.k.toLowerCase()+' · solo administrador'),
 logout:async()=>{await popAll();const b=$('#loginBtn');b.innerHTML='Entrar';b.disabled=false;$('#login').classList.remove('hide');}
};
const FID_SVG='<svg width="74" height="74" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M9 9v1.5M15 9v1.5M12 9v4h-1M9 16c1.6 1.2 4.4 1.2 6 0"/></svg>';
function fmtPlate(s){const c=String(s).toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);return c.length>3?c.slice(0,3)+' '+c.slice(3):c;}
function pvList(q){q=q.toLowerCase().replace(/\s/g,'');return vehicles.filter(v=>!q||(v.plate+v.client+v.brand).toLowerCase().replace(/\s/g,'').includes(q)).slice(0,30).map(v=>`<button class="li" data-act="setQuoteVeh" data-p="${v.plate}">${plate(v.plate)}<div class="grow"><b class="ell">${esc(v.client)}</b><small>${esc(v.brand)} ${esc(v.model)} · ${v.year}</small></div>${state.quote.plate===v.plate?`<span class="ok-c">${ic('check',20,2.6)}</span>`:''}</button>`).join('')||'<div class="empty">Sin resultados</div>';}
async function createOrder(d){
 const id='OT-'+(otSeq++);
 const o=mk(id,d.plate,d.brand,d.model,d.year,d.colorName,'#9CA3AF',d.client,d.phone,d.tech,'rec',1*MIN,d.km,.5,'aceite',{motivo:d.motivo,signed:false,signedAt:null,photos:['lateral','frontal','tablero']});
 o.enteredAt=Date.now();o.updatedAt=Date.now();orders.push(o);
 if(!vehicle(d.plate)){vehicles.unshift(mkVehicle(d.plate,d.brand,d.model,d.year,d.colorName,d.client,d.phone,d.km));clients=buildClients();}
 if(state.tab!=='orders')await setTab('orders');
 if(state.filterTech!=='all'){state.filterTech='all';$$('#techChips .chip').forEach(c=>c.classList.toggle('on',c.dataset.v==='all'));}
 renderBoard();scrollToCol('rec',true);const nc=$(`#board [data-id="${id}"]`);if(nc){nc.classList.add('arrived');const cb=nc.closest('.col-b');if(cb)cb.scrollTop=0;}
 toast('Orden '+id+' creada · '+d.plate);
}

/* ================= EVENTOS ================= */
document.addEventListener('click',e=>{
 const tb=e.target.closest('.tab');if(tb){if(state.pages.length)popAll();if(tb.dataset.tab!==state.tab)setTab(tb.dataset.tab);else{const sc=$('#screen');sc.scrollTo({top:0,behavior:'smooth'});}return;}
 const el=e.target.closest('[data-act]');if(!el)return;
 const fn=ACT[el.dataset.act];if(fn){if(el.tagName==='BUTTON'&&el.type==='submit'&&el.form)return;e.preventDefault();fn(el,e);}
});
$('#screen').addEventListener('scroll',e=>$('#hdr').classList.toggle('sc',e.target.scrollTop>4),{passive:true});
function doLogin(){const b=$('#loginBtn');b.disabled=true;b.innerHTML='<span class="spin"></span>';setTimeout(()=>{$('#login').classList.add('hide');setTab('home');},900);}
$('#loginForm').addEventListener('submit',e=>{e.preventDefault();doLogin();});
$$('.tab .ti').forEach(s=>s.innerHTML=ic(s.dataset.i,23));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#sheetLayer').classList.contains('open'))closeSheet();else if($('#tracking').classList.contains('open'))closeTracking();else if(state.pages.length)popPage();}});
setHeader();
</script>
<script id="nexus-scroll-guard">document.addEventListener("scroll",function(e){var t=e.target;if(t&&t.nodeType===1&&t.scrollTop&&getComputedStyle(t).overflowY==="hidden"){t.scrollTop=0}},true);</script>
