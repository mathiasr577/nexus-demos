<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Comandas">
<meta name="theme-color" content="#18181B">
<title>Comandas &amp; Caja · Fogón de la 70</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23E8590C'/%3E%3Ctext x='90' y='122' font-family='Arial,Helvetica,sans-serif' font-size='104' font-weight='700' fill='white' text-anchor='middle'%3EF%3C/text%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23E8590C'/%3E%3Ctext x='90' y='122' font-family='Arial,Helvetica,sans-serif' font-size='104' font-weight='700' fill='white' text-anchor='middle'%3EF%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#E8590C; --brand-600:#C2410C; --brand-700:#9A3412; --brand-50:#FFF5EE; --brand-100:#FFE6D5;
  --ink:#18181B; --ink-2:#3F3F46; --muted:#71717A; --muted-2:#A1A1AA; --line:#E7E7EA; --line-2:#F0F0F2;
  --bg:#F4F4F5; --card:#FFFFFF;
  --green:#16A34A; --green-50:#ECFDF3; --yellow:#D97706; --yellow-50:#FFFBEB; --red:#DC2626; --red-50:#FEF2F2;
  --rose:#E11D48; --rose-50:#FFF1F3; --blue:#4F46E5; --blue-50:#EEF2FF;
  --dark:#18181B; --dark-2:#232327; --dark-3:#2E2E34;
  --r:16px; --r-sm:12px;
  --sh:0 1px 2px rgba(24,24,27,.04),0 4px 14px rgba(24,24,27,.06);
  --sh-lg:0 10px 40px rgba(24,24,27,.18);
  --st: env(safe-area-inset-top); --sb: env(safe-area-inset-bottom);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;background:#E4E4E7;color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden;font-size:14px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}
input,select,textarea{font:inherit;color:inherit}
.app,.login{position:relative;max-width:430px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;background:var(--bg)}
@media (min-width:500px){.app,.login{box-shadow:0 0 0 1px rgba(0,0,0,.04),0 20px 60px rgba(0,0,0,.18)}}
.app{display:flex;flex-direction:column}
.hidden{display:none!important}

/* ===== LOGIN ===== */
.login{background:var(--dark);color:#fff;display:flex;flex-direction:column;padding:calc(var(--st) + 56px) 24px calc(var(--sb) + 24px);z-index:50;transition:opacity .45s,transform .45s}
.login.out{opacity:0;transform:scale(1.04);pointer-events:none}
.lg-mark{width:64px;height:64px;border-radius:20px;background:var(--brand);display:grid;place-items:center;box-shadow:0 10px 30px rgba(232,89,12,.35)}
.lg-mark svg{width:34px;height:34px}
.login h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin-top:22px}
.login .sub{color:#A1A1AA;margin-top:6px;font-size:15px}
.lg-form{margin-top:40px;display:flex;flex-direction:column;gap:14px}
.lg-field{background:var(--dark-2);border:1px solid var(--dark-3);border-radius:14px;padding:10px 14px}
.lg-field label{display:block;font-size:11.5px;color:#A1A1AA;font-weight:600;margin-bottom:3px}
.lg-field input{background:none;border:0;outline:0;width:100%;font-size:16px;color:#fff}
.lg-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#A1A1AA;margin-top:2px}
.lg-row a{color:#FDBA8C;text-decoration:none;font-weight:600}
.btn-primary{background:var(--brand);color:#fff;font-weight:700;font-size:16px;border-radius:14px;height:54px;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .12s,background .2s}
.btn-primary:active{transform:scale(.98);background:var(--brand-600)}
.btn-primary:disabled{opacity:.5}
.btn-ghost-dark{background:var(--dark-2);border:1px solid var(--dark-3);color:#fff;font-weight:600;border-radius:14px;height:52px;width:100%;display:flex;align-items:center;justify-content:center;gap:10px}
.spin{width:20px;height:20px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:rot .7s linear infinite}
.spin.dk{border-color:rgba(0,0,0,.12);border-top-color:var(--brand)}
@keyframes rot{to{transform:rotate(360deg)}}
.lg-foot{margin-top:auto;text-align:center;color:#71717A;font-size:12px}
.faceid{position:absolute;inset:0;background:rgba(24,24,27,.92);display:grid;place-items:center;z-index:5;opacity:0;pointer-events:none;transition:opacity .25s}
.faceid.on{opacity:1;pointer-events:auto}
.fid-box{width:120px;height:120px;position:relative;display:grid;place-items:center}
.fid-box svg{width:90px;height:90px}
.fid-scan{position:absolute;left:10px;right:10px;height:3px;background:var(--brand);box-shadow:0 0 18px var(--brand);border-radius:3px;animation:scan 1s ease-in-out infinite alternate}
@keyframes scan{from{top:12px}to{top:104px}}
.fid-txt{text-align:center;margin-top:14px;color:#D4D4D8;font-weight:600}

/* ===== HEADER ===== */
.top{flex:none;background:var(--card);padding:calc(var(--st) + 10px) 16px 10px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);z-index:5;transition:background .3s,border-color .3s}
.top .mark{width:38px;height:38px;border-radius:12px;background:var(--brand);display:grid;place-items:center;flex:none}
.top .mark svg{width:20px;height:20px}
.back{width:38px;height:38px;border-radius:12px;background:var(--bg);display:grid;place-items:center;flex:none}
.back svg{width:20px;height:20px}
.top .tt{flex:1;min-width:0}
.top h2{font-size:18px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .st{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic-btn{width:38px;height:38px;border-radius:12px;background:var(--bg);display:grid;place-items:center;position:relative;flex:none}
.ic-btn svg{width:20px;height:20px}
.dot-badge{position:absolute;top:6px;right:7px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--rose);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;border:2px solid var(--card)}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.app.kds .top{background:var(--dark);border-color:var(--dark-3);color:#fff}
.app.kds .top .st{color:#A1A1AA}
.app.kds .ic-btn,.app.kds .back{background:var(--dark-2)}
.app.kds .dot-badge{border-color:var(--dark)}
.app.kds .avatar{background:var(--brand)}

/* ===== VIEW ===== */
#view{position:relative;flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:14px 16px calc(var(--sb) + 104px);transition:background .3s}
.app.kds #view{background:#0F0F11}
.enter{animation:enter .32s cubic-bezier(.2,.8,.2,1)}
.enter-r{animation:enterR .32s cubic-bezier(.2,.8,.2,1)}
.enter-l{animation:enterL .32s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes enterR{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
@keyframes enterL{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}

/* ===== TABBAR ===== */
.tabbar{position:absolute;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(var(--sb) + 6px);z-index:20}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;color:var(--muted-2);font-size:10.5px;font-weight:600;position:relative;transition:color .2s}
.tabbar button svg{width:24px;height:24px;transition:transform .2s}
.tabbar button.on{color:var(--brand)}
.tabbar button.on svg{transform:translateY(-1px) scale(1.06)}
.tabbar .tb{position:absolute;top:1px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:10px;background:var(--rose);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;border:2px solid #fff}
.tabbar .tb.bump{animation:pop .4s}

/* ===== COMMON ===== */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid rgba(0,0,0,.03)}
.sec-t{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:20px 2px 10px;display:flex;align-items:center;justify-content:space-between}
.sec-t .lnk{color:var(--brand);text-transform:none;letter-spacing:0;font-size:13px;font-weight:700}
.muted{color:var(--muted)}
.seg{display:flex;background:#E9E9EC;border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;height:36px;border-radius:9px;font-weight:700;font-size:13px;color:var(--ink-2);display:flex;align-items:center;justify-content:center;gap:6px;transition:background .2s,color .2s,box-shadow .2s}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.seg .cnt{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--brand);color:#fff;font-size:10.5px;display:grid;place-items:center}
.app.kds .seg{background:var(--dark-2)}
.app.kds .seg button{color:#A1A1AA}
.app.kds .seg button.on{background:var(--dark-3);color:#fff;box-shadow:none}
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.p-green{background:var(--green-50);color:var(--green)}
.p-orange{background:var(--brand-50);color:var(--brand-600)}
.p-rose{background:var(--rose-50);color:var(--rose)}
.p-blue{background:var(--blue-50);color:var(--blue)}
.p-gray{background:var(--line-2);color:var(--ink-2)}
.p-yellow{background:var(--yellow-50);color:var(--yellow)}
.btn{height:46px;border-radius:13px;padding:0 16px;font-weight:700;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,background .2s}
.btn:active{transform:scale(.97)}
.b-brand{background:var(--brand);color:#fff}
.b-dark{background:var(--ink);color:#fff}
.b-soft{background:var(--brand-50);color:var(--brand-600)}
.b-line{background:#fff;border:1px solid var(--line);color:var(--ink)}
.b-green{background:var(--green);color:#fff}
.w100{width:100%}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:13px;height:44px;padding:0 12px}
.search svg{width:18px;height:18px;color:var(--muted-2);flex:none}
.search input{border:0;outline:0;background:none;width:100%;font-size:15px}
.empty{text-align:center;padding:36px 10px;color:var(--muted)}
.empty .e{font-size:38px;margin-bottom:6px}
.skel{background:linear-gradient(90deg,#ECECEF 25%,#F6F6F8 50%,#ECECEF 75%);background-size:200% 100%;animation:shim 1s linear infinite;border-radius:14px}
.app.kds .skel{background:linear-gradient(90deg,#1E1E22 25%,#2A2A30 50%,#1E1E22 75%);background-size:200% 100%}
@keyframes shim{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}12%{transform:translateX(-7px) rotate(-1deg)}26%{transform:translateX(7px) rotate(1deg)}40%{transform:translateX(-5px)}54%{transform:translateX(5px)}68%{transform:translateX(-2px)}82%{transform:translateX(2px)}}
.pop{animation:pop .45s cubic-bezier(.2,.8,.2,1) both}
.shake{animation:shake .7s ease both}

/* ===== MESAS ===== */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi{padding:11px 12px}
.kpi .l{font-size:11.5px;color:var(--muted);font-weight:600}
.kpi .v{font-size:18px;font-weight:800;letter-spacing:-.02em;margin-top:2px;white-space:nowrap}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin:12px 2px 10px;font-size:12px;color:var(--ink-2);font-weight:600}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:50%}
.plan{background:#fff;border-radius:20px;padding:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;box-shadow:var(--sh);background-image:radial-gradient(#E4E4E7 1px,transparent 1px);background-size:14px 14px}
.deco{grid-column:1/-1;height:34px;border-radius:10px;background:var(--line-2);display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted);border:1px dashed #D4D4D8}
.tw{position:relative;height:114px}
.tw.span2{grid-column:span 2}
.ch{position:absolute;background:#D4D4D8;border-radius:5px;transform:translate(-50%,-50%);z-index:0;transition:background .3s}
.ch.h{width:20px;height:7px}
.ch.v{width:7px;height:20px}
.ch.c{width:12px;height:12px;border-radius:50%}
.tbl{position:absolute;inset:10px;border-radius:14px;background:#fff;border:2px solid var(--line);z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;text-align:center;transition:transform .15s,background .3s,border-color .3s}
.tbl:active{transform:scale(.95)}
.sh-round .tbl{inset:auto;width:90px;height:90px;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}
.sh-round .tbl:active{transform:translate(-50%,-50%) scale(.95)}
.tbl b{font-size:15px;font-weight:800;letter-spacing:-.01em}
.tbl .s1{font-size:10.5px;font-weight:700}
.tbl .s2{font-size:11.5px;font-weight:800}
.st-libre .tbl{background:#F6FEF9;border-color:#A7E3BC}.st-libre .tbl .s1{color:var(--green)}.st-libre .ch{background:#BDE8CC}
.st-ocupada .tbl{background:var(--brand-50);border-color:#FBB98C}.st-ocupada .tbl .s1{color:var(--brand-600)}.st-ocupada .ch{background:#FBC6A2}
.st-porpagar .tbl{background:var(--rose-50);border-color:#FDA4B4;animation:ring 1.6s infinite}.st-porpagar .tbl .s1{color:var(--rose)}.st-porpagar .ch{background:#FBB7C3}
.st-reservada .tbl{background:var(--blue-50);border-color:#B4BCF7;border-style:dashed}.st-reservada .tbl .s1{color:var(--blue)}.st-reservada .ch{background:#C7CCF8}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(225,29,72,.35)}70%{box-shadow:0 0 0 9px rgba(225,29,72,0)}100%{box-shadow:0 0 0 0 rgba(225,29,72,0)}}
.dlv{padding:14px;margin-bottom:10px}
.dlv .hd{display:flex;align-items:center;gap:8px}
.plat{height:26px;padding:0 9px;border-radius:8px;color:#fff;font-weight:800;font-size:12px;display:inline-flex;align-items:center;gap:5px}
.pl-rappi{background:#FF441F}.pl-didi{background:#FF7A00}.pl-propio{background:var(--ink)}
.dlv .who{margin-top:10px;font-weight:700;font-size:14.5px}
.dlv .adr{font-size:12.5px;color:var(--muted);margin-top:2px}
.dlv .its{font-size:13px;color:var(--ink-2);margin-top:8px;line-height:1.45}
.steps{display:flex;gap:4px;margin:12px 0}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--brand)}
.dlv.new{border:2px solid #FF441F}
.dlv.done{opacity:.6}

/* ===== PEDIDO ===== */
.tchip{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:14px;background:var(--ink);color:#fff;text-align:left}
.tchip .ti{width:36px;height:36px;border-radius:10px;background:var(--brand);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.tchip .l1{font-weight:700;font-size:14.5px}
.tchip .l2{font-size:12px;color:#A1A1AA}
.tchip svg{width:18px;height:18px;margin-left:auto;color:#A1A1AA}
.cats{display:flex;gap:8px;overflow-x:auto;margin:12px -16px 12px;padding:0 16px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;height:38px;padding:0 14px;border-radius:12px;background:#fff;border:1px solid var(--line);font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:6px;transition:all .2s}
.cat.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mi{position:relative;background:#fff;border-radius:16px;box-shadow:var(--sh);overflow:hidden}
.mi-main{display:block;width:100%;text-align:left;padding:8px 8px 11px;transition:transform .12s}
.mi-main:active{transform:scale(.97)}
.mi-img{height:96px;border-radius:12px;display:grid;place-items:center;position:relative;overflow:hidden}
.mi-img .em{font-size:50px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.16));transition:transform .2s}
.mi-main:active .em{transform:scale(1.12) rotate(-6deg)}
.mi-img:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.55),transparent 60%)}
.mi-name{font-weight:700;font-size:13.5px;margin:9px 4px 0;line-height:1.25;min-height:34px}
.mi-price{font-weight:800;font-size:14px;margin:3px 4px 0;color:var(--brand-600)}
.qb{position:absolute;top:14px;left:14px;min-width:26px;height:26px;border-radius:13px;background:var(--ink);color:#fff;font-weight:800;font-size:12.5px;display:grid;place-items:center;padding:0 7px;z-index:2}
.mi-cust{position:absolute;right:12px;bottom:10px;width:32px;height:32px;border-radius:10px;background:var(--line-2);display:grid;place-items:center}
.mi-cust svg{width:17px;height:17px;color:var(--ink-2)}
.tag-m{position:absolute;top:14px;right:14px;z-index:2;font-size:10px;font-weight:800;background:rgba(255,255,255,.9);padding:3px 7px;border-radius:7px;color:var(--ink-2)}
.cartbar{position:absolute;left:12px;right:12px;bottom:calc(var(--sb) + 74px);height:58px;border-radius:16px;background:var(--brand);color:#fff;display:flex;align-items:center;gap:12px;padding:0 16px 0 10px;box-shadow:0 10px 30px rgba(232,89,12,.4);z-index:19;transform:translateY(140%);opacity:0;visibility:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .25s,visibility .35s}
.cartbar.show{transform:none;opacity:1;visibility:visible}
.cartbar .cc{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-weight:800}
.cartbar .ct{font-weight:700;flex:1;text-align:left}
.cartbar .ct small{display:block;font-weight:500;opacity:.85;font-size:11.5px}
.cartbar b{font-size:16px}
.cartbar.bump{animation:bump .35s}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
.fly{position:fixed;z-index:100;font-size:44px;pointer-events:none;will-change:transform}

/* ===== COCINA (KDS) ===== */
.kgrid{display:grid;grid-template-columns:1fr;gap:10px}
.tk{background:#1C1C20;border-radius:16px;color:#fff;overflow:hidden;border:1px solid #2A2A30;border-top:5px solid var(--green);transition:border-color .4s}
.tk.t-y{border-top-color:#EAB308}
.tk.t-r{border-top-color:#EF4444}
.tk .h{display:flex;align-items:center;gap:8px;padding:12px 14px 8px}
.tk .h b{font-size:17px;font-weight:800}
.tk .h .ch2{font-size:11px;font-weight:700;color:#A1A1AA;background:#2A2A30;border-radius:6px;padding:3px 7px}
.tmr{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:800;font-size:15px;padding:4px 10px;border-radius:9px;background:rgba(34,197,94,.15);color:#4ADE80;transition:all .4s}

function makeTickets(label, channel, lines, mesero, createdAt) {
  const groups = { cocina: [], barra: [] };
  lines.forEach(l => groups[station(l)].push({ n: M(l.itemId).n, qty: l.qty, mods: l.mods.slice(), note: l.note, done: false }));
  const made = [];
  ['cocina', 'barra'].forEach(st => {
    if (!groups[st].length) return;
    const tk = { id: S.tkSeq++, label, channel, station: st, items: groups[st], created: createdAt || now(), status: 'prep', mesero };
    S.tickets.push(tk); made.push(tk);
  });
  return made;
}
function deduct(lines) {
  const touched = {};
  lines.forEach(l => {
    const r = M(l.itemId).r || {};
    Object.keys(r).forEach(k => {
      const ing = ING[k]; if (!ing) return;
      if (!(k in touched)) touched[k] = ing.s;
      ing.s = Math.max(0, Math.round((ing.s - r[k] * l.qty) * 100) / 100);
    });
    S.sales.top[l.itemId] = (S.sales.top[l.itemId] || 0) + l.qty;
  });
  const lows = Object.keys(touched).filter(k => ING[k].s <= ING[k].min)
    .map(k => ({ k, crossed: touched[k] > ING[k].min }))
    .sort((a, b) => (b.crossed - a.crossed) || (ING[a.k].s / ING[a.k].min - ING[b.k].s / ING[b.k].min));
  return lows.slice(0, 2).map(x => x.k);
}

function newDelivery(plat, createdAt) {
  plat = plat || (Math.random() < .62 ? 'rappi' : (Math.random() < .65 ? 'didi' : 'propio'));

  const n = rnd(1, 3), lines = [], used = {};
  for (let i = 0; i < n; i++) { let m = pick(pool); if (used[m.id]) continue; used[m.id] = 1; lines.push(L(m.id, rnd(1, 2))); }
  if (Math.random() < .7) lines.push(L(pick(['b1', 'b2', 'b4']), rnd(1, 2), ['En agua'].slice(0, 0)));
  const code = '#' + PLAT[plat].p + '-' + rnd(41200, 48999);

function ding(kind) {
  if (!AC || !S.settings.sound) return;
  try {
    if (AC.state === 'suspended') AC.resume();
    const notes = kind === 'order' ? [880, 1320, 1760] : kind === 'ok' ? [660, 990] : [520, 440];
    notes.forEach((f, i) => {
      const o = AC.createOscillator(), g = AC.createGain(), t0 = AC.currentTime + i * .11;

      o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0 + .35);
    });
  } catch (e) { /* noop */ }
}

    const m = M(d.v), c = recipeCost(m);
    let h = sh_h(m.e + ' ' + m.n, 'Receta estándar · precio ' + fmt(m.p));
    h += Object.keys(m.r).map(k => '<div class="ln"><span style="font-size:20px">' + ING[k].e + '</span><div class="grow"><div class="n">' + ING[k].n + '</div><div class="m">' + fq(m.r[k]) + ' ' + ING[k].u + ' · stock ' + fq(ING[k].s) + ' ' + ING[k].u + '</div></div><span class="p">' + fmt(ING[k].c * m.r[k]) + '</span></div>').join('');
    h += '<div class="tot"><div class="r"><span>Costo del plato</span><span>' + fmt(c) + '</span></div><div class="r"><span>Precio de venta</span><span>' + fmt(m.p) + '</span></div><div class="r big"><span>Margen</span><span style="color:var(--green)">' + fmt(m.p - c) + ' · ' + Math.round((1 - c / m.p) * 100) + '%</span></div></div><div class="muted" style="font-size:12.5px">Cada vez que se envía este plato a cocina, estos ingredientes se descuentan automáticamente del inventario.</div>';
    openSheet(h);
  },
  newBuy(d) { buySheet(d.v); },
  buyOk() {
    const pv = $('#bPv').value, ing = $('#bIng').value, qty = Math.max(1, parseFloat($('#bQty').value) || 1);
    S.compras.push({ id: uid(), pv, ing, qty, total: qty * ING[ing].c, date: now(), st: 'En camino' });
    closeSheet(); if (S.tab === 'mas') { S.sub = 'prov'; renderTop(); render('enter'); }
    toast('Orden enviada a ' + PV(pv).n + ' por WhatsApp 🚚');
  },
  recvBuy(d) { const c = S.compras.find(x => x.id === d.v); c.st = 'Recibido'; ING[c.ing].s = Math.round((ING[c.ing].s + c.qty) * 10) / 10; render(); renderTabs(); toast('+' + fq(c.qty) + ' ' + ING[c.ing].u + ' de ' + ING[c.ing].n.toLowerCase() + ' al inventario'); },
  provSheet(d) {
    const p = PV(d.v);
    let h = sh_h(p.e + ' ' + p.n, p.cat);
    h += '<div class="tot"><div class="r"><span>Teléfono</span><span>' + p.tel + '</span></div><div class="r"><span>Días de entrega</span><span>' + p.dia + '</span></div><div class="r"><span>Compras este mes</span><span>' + fmt(S.compras.filter(c => c.pv === p.id).reduce((a, c) => a + c.total, 0) + 1250000) + '</span></div></div>';
    h += '<div class="opt-t">Productos</div><div class="chips">' + p.ing.map(k => '<span class="chip" style="display:inline-flex;align-items:center">' + ING[k].e + ' ' + ING[k].n + '</span>').join('') + '</div>';
    h += '<div class="acts" style="margin-top:18px"><button class="btn b-line" data-act="call" data-v="' + esc(p.n) + '">📞 Llamar</button><button class="btn b-brand" data-act="newBuy" data-v="' + p.ing[0] + '">🚚 Pedir</button></div>';
    openSheet(h);
  },
  call(d) { closeSheet(); toast('Llamando a ' + d.v + '…'); },
  mesOn(d, el) { const m = W(d.v); m.on = !m.on; el.classList.toggle('on', m.on); toast(m.n.split(' ')[0] + (m.on ? ' entró a turno' : ' salió de turno')); setTimeout(render, 300); },
  liqTips() {
    let h = sh_h('Liquidar propinas', 'Turno de hoy');
    h += MES.filter(m => m.prop > 0).map(m => '<div class="ln" style="align-items:center"><span class="wav" style="background:' + m.col + ';width:34px;height:34px;font-size:12px">' + m.ini + '</span><div class="grow"><div class="n">' + m.n + '</div><div class="m">' + m.mesas + ' mesas atendidas</div></div><span class="p">' + fmt(m.prop) + '</span></div>').join('');
    h += '<div class="tot"><div class="r big"><span>Total</span><span>' + fmt(MES.reduce((a, m) => a + m.prop, 0)) + '</span></div></div><button class="btn b-brand w100" style="height:52px" data-act="liqOk">Enviar por Nequi</button>';
    openSheet(h);
  },
  liqOk(d, el) { el.innerHTML = '<span class="spin"></span> Enviando…'; setTimeout(() => { closeSheet(); toast('Propinas enviadas a ' + MES.filter(m => m.prop > 0).length + ' meseros 💸'); }, 1100); },
  newRes() { resForm(); },
  resOk() {
    const name = $('#rN').value.trim() || 'Cliente', people = Math.max(1, parseInt($('#rP').value, 10) || 2), hm = ($('#rH').value || '20:00').split(':'), tid = $('#rM').value;
    const dt = new Date(); dt.setHours(+hm[0], +hm[1], 0, 0); if (dt.getTime() < now() - 30 * MIN) dt.setDate(dt.getDate() + 1);
    const r = { id: uid(), name, people, time: dt.getTime(), table: tid, tel: $('#rT').value, note: $('#rNo').value, st: 'Confirmada' };
    S.reservas.push(r);
    if (tid) { const t = T(tid); t.st = 'reservada'; t.resv = { name, people, time: r.time, tel: r.tel, note: r.note }; }
    closeSheet(); render(); toast('Reserva de ' + esc(name) + ' guardada · confirmación enviada 💬');
  },
  resSheet(d) {
    const r = S.reservas.find(x => x.id === d.v);
    let h = sh_h(esc(r.name), hhmm(r.time) + ' · ' + r.people + ' personas');
    h += '<div class="tot"><div class="r"><span>Mesa</span><span>' + (r.table ? r.table : 'Sin asignar') + '</span></div><div class="r"><span>Teléfono</span><span>' + esc(r.tel) + '</span></div><div class="r"><span>Estado</span><span>' + r.st + '</span></div>' + (r.note ? '<div class="r"><span>Nota</span><span>' + esc(r.note) + '</span></div>' : '') + '</div>';
    h += '<div class="acts"><button class="btn b-brand" data-act="resConf" data-v="' + r.id + '">💬 Confirmar</button><button class="btn b-line" data-act="resDel" data-v="' + r.id + '" style="color:var(--rose)">Cancelar</button></div>';
    openSheet(h);
  },
  resConf(d) { const r = S.reservas.find(x => x.id === d.v); r.st = 'Confirmada'; closeSheet(); render(); toast('Confirmación enviada a ' + esc(r.name) + ' 💬'); },
  resDel(d) { const r = S.reservas.find(x => x.id === d.v); S.reservas = S.reservas.filter(x => x !== r); if (r.table) { const t = T(r.table); if (t && t.st === 'reservada') { t.st = 'libre'; t.resv = null; } } closeSheet(); render(); toast('Reserva cancelada'); },
  setTg(d, el) { S.settings[d.v] = !S.settings[d.v]; el.classList.toggle('on', S.settings[d.v]); toast((S.settings[d.v] ? 'Activado: ' : 'Desactivado: ') + el.getAttribute('aria-label')); },
  logout() { clearTimeout(liveT); $('#app').classList.add('hidden'); const lg = $('#login'); lg.classList.remove('hidden'); requestAnimationFrame(() => lg.classList.remove('out')); const b = $('#lgBtn'); b.textContent = 'Entrar'; b.disabled = false; },
  notifs() {
    S.unread = 0; renderTop();
    let h = sh_h('Notificaciones', S.notifs.length ? S.notifs.length + ' de este turno' : 'Todo tranquilo');
    h += S.notifs.length ? '<div class="list" style="box-shadow:none;border:1px solid var(--line)">' + S.notifs.slice(0, 30).map(n => '<button class="li" data-act="pushTap" data-go="' + (n.go || '') + '"><span class="ic" style="background:' + n.col + ';color:#fff">' + n.icon + '</span><div class="grow"><div class="t1" style="font-size:13.5px">' + n.title + '</div><div class="t2">' + n.body + '</div></div><span class="muted" style="font-size:11px">' + hhmm(n.at) + '</span></button>').join('') + '</div>' : '<div class="empty"><div class="e">🔔</div>Aquí verás pedidos de Rappi, DiDi y alertas de inventario</div>';
    openSheet(h);
  },
  profile() { go('mas'); },
  pushTap(d, el) {
    el.classList && el.classList.remove('on');
    const g = (el.dataset.go || '');
    closeSheet();
    if (g === 'dlv') { S.zone = 'domicilios'; go('mesas', { noSkel: S.tab === 'mesas' }); }
    else if (g.indexOf('inv:') === 0) { S.invMode = 'bajo'; S.invQ = ''; go('mas', { sub: 'inv' }); setTimeout(() => ingSheet(g.slice(4)), 600); }
  },
  closeSheet() { closeSheet(); },
  noop() {}
};
function openSheetKeep(html) { const b = $('#sbody'); const y = b.scrollTop; b.innerHTML = html; b.scrollTop = y; }
function paySheetKeep() { const b = $('#sbody'), y = b.scrollTop; paySheet(); b.classList.remove('swap'); b.scrollTop = y; }
function customSheetKeep() { const b = $('#sbody'), y = b.scrollTop; customSheet(); b.classList.remove('swap'); b.scrollTop = y; }
function cartSheetKeep() { const b = $('#sbody'), y = b.scrollTop; cartSheet(); b.classList.remove('swap'); b.scrollTop = y; }
function saveNote() { const n = $('#cnote'); if (n && S.custom) S.custom.note = n.value.trim(); }
// keep split sheet scroll when re-rendering inside it
const _splitSheet = splitSheet;
splitSheet = function () { const b = $('#sbody'), on = $('#sheet').classList.contains('on'), y = b.scrollTop, inSplit = on && b.querySelector('.ppl'); _splitSheet(); if (inSplit) { b.classList.remove('swap'); b.scrollTop = y; } };

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.disabled) return;
  const f = A[el.dataset.act]; if (f) f(el.dataset, el, e);
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { S.q = e.target.value; $$('.cat').forEach(c => c.classList.toggle('on', !S.q && c.dataset.v === S.cat)); $('#mgrid').innerHTML = menuGrid(); }
  if (e.target.id === 'invq') { S.invQ = e.target.value; $('#invlist').innerHTML = invList(); $$('.stk i').forEach(i => { i.style.width = i.dataset.w; }); }
  if (e.target.id === 'bQty' || e.target.id === 'bIng') { const g = ING[$('#bIng').value], q = parseFloat($('#bQty').value) || 0; $('#bVal').value = fmt(q * g.c); }
  if (e.target.id === 'contado') { const v = parseInt(e.target.value.replace(/\D/g, ''), 10) || 0, dif = v - (S._esperado || 0); $('#difRow').innerHTML = '<span>Diferencia</span><span class="pill ' + (dif === 0 ? 'p-green' : 'p-rose') + '">' + fmt(dif) + (dif === 0 ? ' · Cuadrada ✓' : dif > 0 ? ' · Sobrante' : ' · Faltante') + '</span>'; }
});
document.addEventListener('change', e => {
  if (e.target.id === 'bPv') { const p = PV(e.target.value); $('#bIng').value = p.ing[0]; const g = ING[p.ing[0]], q = parseFloat($('#bQty').value) || 0; $('#bVal').value = fmt(q * g.c); }
  if (e.target.id === 'bIng') { const g = ING[e.target.value], q = parseFloat($('#bQty').value) || 0; $('#bVal').value = fmt(q * g.c); }
});

function enterApp() {
  const lg = $('#login'); lg.classList.add('out');
  const app = $('#app'); app.classList.remove('hidden');
  S.tab = 'mesas'; S.sub = null; S.zone = 'salon';
  go('mesas');
  setTimeout(() => lg.classList.add('hidden'), 450);
  liveTick.n = 0; scheduleLive(9000);
}
</script>
<script id="nexus-scroll-guard">document.addEventListener("scroll",function(e){var t=e.target;if(t&&t.nodeType===1&&t.scrollTop&&getComputedStyle(t).overflowY==="hidden"){t.scrollTop=0}},true);</script>
</body>
</html>
